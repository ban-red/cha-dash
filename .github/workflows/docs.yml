name: Docs

# The docs site (docs-site/, VitePress). Pull requests build it, so a dead
# link or a broken generator fails there; a push to main also publishes it
# to GitHub Pages. Every action is pinned by commit SHA; the comment names
# the release.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.event.pull_request.number || github.ref }}
  # A new push to a pull request cancels the build it replaces. Deploys on
  # main run one at a time and are never cancelled half way.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Keep in step with ci.yml and the oven/bun image in the Dockerfile.
  BUN_VERSION: "1.4.4"

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # This job's output is published; no cache another run could have written.
          cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: bun install
        run: bun install --frozen-lockfile
      # The API pages are rendered from the hub's OpenAPI document, which
      # internal/apidoc builds from the route table.
      - name: OpenAPI document
        run: CHADASH_WRITE_OPENAPI="$GITHUB_WORKSPACE/docs-site/public/openapi.json" go test ./internal/apidoc/ -run '^TestWriteOpenAPI$' -count=1
      - name: Generator tests
        working-directory: docs-site
        run: bun test
      # Generates the pages from the repository, then builds the site. A
      # dead link between pages fails the build.
      - name: Build
        run: bun run docs:build
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.event_name != 'pull_request'
        with:
          path: docs-site/.vitepress/dist

  deploy:
    name: Deploy
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Only this job can publish, and only to the github-pages environment.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
