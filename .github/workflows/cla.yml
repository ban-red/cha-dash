name: CLA

# Asks first-time contributors to sign CLA.md (OSI-limited relicensing) with a PR comment.
# pull_request_target is required so the bot can comment on PRs from forks; this workflow
# never checks out or runs code from the pull request.
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write       # commits signatures to the cla-signatures branch
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'pull_request_target' ||
      github.event.comment.body == 'recheck' ||
      github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'
    steps:
      - name: CLA Assistant
        # contributor-assistant/github-action v2.6.1, pinned by commit
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: https://github.com/ban-red/cha-dash/blob/main/CLA.md
          path-to-signatures: signatures/v1/cla.json
          branch: cla-signatures      # unprotected branch that only holds signatures
          allowlist: ban-red,dependabot[bot],renovate[bot]
          custom-notsigned-prcomment: >-
            Thanks for contributing to Cha Dash! Before we can merge, please read our
            [Contributor License Agreement](https://github.com/ban-red/cha-dash/blob/main/CLA.md).
            You keep your copyright, and your contribution can only ever be released under
            OSI-approved open-source licences. To sign, reply with the comment below.
          custom-allsigned-prcomment: All contributors have signed the CLA. Thank you!
