name: CI

# Every push to main and every pull request into it. The token is read-only, and
# every action is pinned by commit SHA; the comment names the release.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  # A new push to a pull request cancels the run it replaces. Runs on main always
  # finish, so every commit there gets a result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Keep in step with the oven/bun image in the Dockerfile.
  BUN_VERSION: "1.4.2"
  # Budgets from docs/plan/03-architecture.md, "Performance budgets". Raising
  # one takes a reason in the pull request.
  INITIAL_JS_BUDGET_KB: "150"   # entry script + modulepreloads, gzip -6, 1 kB = 1000 bytes
  IMAGE_BUDGET_MB: "40"         # the whole image, gzip -6
  NODE_BINARY_BUDGET_MB: "40"   # chadash-node, stripped (ADR-0016, ADR-0020); 1 MB = 1000000 bytes

defaults:
  run:
    shell: bash                 # -eo pipefail

# Required checks for branch protection (ADR-0016): Go (amd64), Go (arm64),
# JavaScript, Build, Image (amd64) and Image (arm64).
#
# Jobs marked best-effort (armv7) or non-blocking (the footprint) are kept
# out of the required checks instead of using continue-on-error: a failure
# shows as a failed check on the pull request, and a failed run on main, but
# never blocks a merge.
jobs:
  # amd64 and arm64 are the supported platforms: every check runs natively on
  # both, and both legs are required.
  go:
    name: Go (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false          # an arm64-only failure still reports amd64, and vice versa
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm   # free for public repositories
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod   # go 1.27.3
          cache-dependency-path: |
            go.sum
            tools/go.sum
      - name: gofmt
        run: |
          unformatted=$(git ls-files -z '*.go' | xargs -0 gofmt -l)
          if [ -n "$unformatted" ]; then
            echo "::error::Run gofmt -w on: $(echo "$unformatted" | tr '\n' ' ')"
            exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: go test -race
        run: go test -race ./...
      - name: Performance budgets
        # The hub's budgets that run headlessly (web/README.md, "Budgets"):
        # GET / with the inline snapshot (median, p95), the snapshot's size,
        # and one tab's realtime diff rate on the Demo Home. Without -race,
        # which skips them, and one package at a time, so they don't time
        # each other; the numbers are in the test files.
        run: |
          go test -p 1 -count=1 -run '^TestBudget' -v ./internal/server/ ./internal/demo/ | tee budgets.txt
          { echo "### Performance budgets (${{ matrix.arch }})"; echo; sed -n 's/^ *budget_test.go:[0-9]*: /- /p' budgets.txt; } >> "$GITHUB_STEP_SUMMARY"
      - name: The Dockerfile copies every package the hub and the node import
        # Each binary's build stage must COPY every top-level directory its
        # `go list -deps` names: the hub's stage (hub) and the node's
        # (node-build), checked separately.
        run: |
          python3 - <<'PY'
          import re, subprocess, sys
          lines = open("Dockerfile", encoding="utf-8").read().splitlines()
          def stage(name):
              out, inside = [], False
              for l in lines:
                  if l.startswith("FROM "):
                      inside = l.rstrip().endswith(" AS " + name)
                  elif inside:
                      out.append(l.strip())
              return out
          failed = False
          for pkg, name in (("./cmd/chadash", "hub"), ("./cmd/chadash-node", "node-build")):
              deps = subprocess.run(["go", "list", "-deps", pkg], check=True, capture_output=True, text=True).stdout.split()
              dirs = sorted({m.group(1) for d in deps if (m := re.match(r"dash\.cha\.sh/([^/]+)", d))})
              body = stage(name)
              if not body:
                  sys.exit(f"::error::No '{name}' stage in the Dockerfile")
              missing = [d for d in dirs if f"COPY {d} {d}" not in body]
              if missing:
                  print(f"::error::Add COPY lines to the Dockerfile's {name} stage for: {' '.join(missing)}")
                  failed = True
          sys.exit(1 if failed else 0)
          PY
      - name: dev login (-tags devlogin)
        # Only `bun run dev` builds with this tag; release builds must not.
        run: |
          go vet -tags devlogin ./...
          go test -race -tags devlogin ./internal/auth/ ./internal/server/ ./cmd/chadash/
      - name: go fix
        # Since Go 1.26, go fix applies the modernizers (errors.AsType,
        # new(expr), maps.Copy, …). -diff exits 1 if any would apply.
        run: |
          if ! go fix -diff ./... > "$RUNNER_TEMP/fix.diff"; then
            cat "$RUNNER_TEMP/fix.diff"
            echo "::error::Run go fix ./... and commit the result"
            exit 1
          fi
      - name: golangci-lint
        # staticcheck plus the bug-finding linters in .golangci.yml. The
        # tools are pinned in tools/go.mod and built with this Go.
        run: go tool -modfile=tools/go.mod golangci-lint run
      - name: govulncheck
        run: go tool -modfile=tools/go.mod govulncheck ./...

  # linux/arm/v7 is best-effort (ADR-0016): tested as 32-bit and built here,
  # but nothing runs on armv7 hardware. Not a required check (see above).
  go-32bit:
    name: Go 32-bit (best-effort)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CGO_ENABLED: "0"          # the release builds are CGO-free on every platform
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            spikes/node-compose/go.sum
      - name: GOARCH=386 go test
        # 386 has armv7's 32-bit int and its alignment rules for 64-bit
        # atomics, and an amd64 kernel runs it natively: the suite runs as
        # 32-bit with no emulation. (The race detector doesn't support 386.)
        run: GOARCH=386 go test ./...
      - name: GOARCH=arm GOARM=7 go vet
        run: GOARCH=arm GOARM=7 go vet ./...
      - name: Build the hub for linux/arm/v7
        # -tags webui embeds internal/webui/dist. A one-file stand-in is enough
        # to prove the binary compiles; Image (armv7) builds it with the real SPA.
        run: |
          mkdir -p internal/webui/dist
          echo '<!doctype html><title>Cha Dash</title>' > internal/webui/dist/index.html
          GOOS=linux GOARCH=arm GOARM=7 go build -tags webui -trimpath -ldflags "-s -w" \
            -o "$RUNNER_TEMP/chadash-armv7" ./cmd/chadash
          ls -l "$RUNNER_TEMP/chadash-armv7"
      - name: Build chadash-node for linux/arm/v7
        run: |
          GOOS=linux GOARCH=arm GOARM=7 go build -trimpath -ldflags "-s -w" \
            -o "$RUNNER_TEMP/chadash-node-armv7" ./cmd/chadash-node
          ls -l "$RUNNER_TEMP/chadash-node-armv7"
      - name: Build the node spike for linux/arm/v7
        working-directory: spikes/node-compose
        run: |
          GOOS=linux GOARCH=arm GOARM=7 go build -trimpath -ldflags "-s -w" \
            -o "$RUNNER_TEMP/node-armv7" .
          ls -l "$RUNNER_TEMP/node-armv7"

  # The workflows themselves, audited by zizmor: template injection, excessive
  # permissions, unpinned or impostor actions, cache poisoning, … Accepted
  # findings are in .github/zizmor.yml, each with its reason.
  workflows:
    name: Workflows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ZIZMOR_VERSION: "1.31.1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        with:
          version: ${{ env.ZIZMOR_VERSION }}
          advanced-security: false   # the token is read-only: report as annotations and in the log
          annotations: true

  js:
    name: JavaScript
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: bun install
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      - name: Lint
        # oxlint, then ESLint for Vue templates (eslint.config.js)
        run: bun run lint
      - name: Test
        run: bun run test
      - name: Design tokens are up to date
        working-directory: design/tokens
        run: bun run generate --check

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: bun install
        run: bun install --frozen-lockfile
      - name: Build the SPA
        run: bun run build   # Vite writes internal/webui/dist/
      - name: No dev-only code in the bundle
        # web/src/dev/ is for the Vite dev server only (Login as Local Dev).
        run: |
          if grep -rlE 'dev-login|Login as Local Dev' internal/webui/dist; then
            echo "::error::The production bundle contains dev-only code from web/src/dev/"
            exit 1
          fi
      - name: Bundle-size budget
        # Initial JS is what index.html loads before the app can render: module
        # scripts plus their modulepreloads. Lazy chunks don't count.
        run: |
          python3 - <<'PY'
          import gzip, os, sys
          from html.parser import HTMLParser
          from pathlib import Path

          dist = Path("internal/webui/dist")
          budget = int(os.environ["INITIAL_JS_BUDGET_KB"]) * 1000

          class Initial(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.refs = []
              def handle_starttag(self, tag, attrs):
                  a = dict(attrs)
                  rel = (a.get("rel") or "").split()
                  if tag == "script" and a.get("src"):
                      self.refs.append(a["src"])
                  elif tag == "link" and "modulepreload" in rel and a.get("href"):
                      self.refs.append(a["href"])

          def gz(path):
              return len(gzip.compress(path.read_bytes(), compresslevel=6))

          index = dist / "index.html"
          if not index.is_file():
              sys.exit(f"::error::{index} is missing: bun run build should write it")
          parser = Initial()
          parser.feed(index.read_text(encoding="utf-8"))

          rows, total = [], 0
          for ref in dict.fromkeys(parser.refs):
              if "://" in ref or ref.startswith("//"):
                  sys.exit(f"::error::index.html loads {ref} from another origin; the CSP forbids that")
              rel = ref.split("?")[0].split("#")[0]
              rel = rel[2:] if rel.startswith("./") else rel.lstrip("/")
              path = dist / rel
              if not path.is_file():
                  sys.exit(f"::error::index.html references {ref}, which isn't in {dist}")
              size = gz(path)
              rows.append((rel, size))
              total += size
          if not rows:
              sys.exit("::error::index.html loads no scripts")
          every_js = sum(gz(p) for p in dist.rglob("*.js"))

          lines = ["| Initial JS | gzip |", "|---|---:|"]
          lines += [f"| `{rel}` | {size / 1000:.1f} kB |" for rel, size in rows]
          lines += [f"| **Total** (budget {budget / 1000:.0f} kB) | **{total / 1000:.1f} kB** |"]
          note = f"All JS in dist, lazy chunks included: {every_js / 1000:.1f} kB gzip."
          print("\n".join(lines) + "\n\n" + note)
          if summary := os.environ.get("GITHUB_STEP_SUMMARY"):
              with open(summary, "a", encoding="utf-8") as f:
                  f.write("### Bundle-size budget\n\n" + "\n".join(lines) + "\n\n" + note + "\n")
          if total > budget:
              print(f"::error::Initial JS is {total / 1000:.1f} kB gzip, over the {budget / 1000:.0f} kB budget. "
                    "Lazy-load something, or raise INITIAL_JS_BUDGET_KB with a reason.")
              sys.exit(1)
          PY
      - name: Build the hub with the SPA embedded
        run: |
          CGO_ENABLED=0 go build -tags webui -trimpath \
            -ldflags "-s -w -X dash.cha.sh/internal/buildinfo.Version=dev -X dash.cha.sh/internal/buildinfo.Commit=${GITHUB_SHA}" \
            -o chadash ./cmd/chadash
      - name: Smoke check
        run: |
          ./chadash version
          ls -l chadash
      - name: Build chadash-node
        run: |
          CGO_ENABLED=0 go build -trimpath \
            -ldflags "-s -w -X dash.cha.sh/internal/buildinfo.Version=dev -X dash.cha.sh/internal/buildinfo.Commit=${GITHUB_SHA}" \
            -o chadash-node ./cmd/chadash-node
          ./chadash-node version
          ls -l chadash-node

  # One leg per published platform; nothing is pushed. Every leg builds
  # without emulation: Bun and Go run on the runner's own platform, and Go
  # cross-compiles for the target.
  # - amd64 and arm64 build on their own runners, so their images run natively
  #   for the smoke test. Both are required.
  # - arm/v7 is built on amd64 and can't run there. Its leg checks the image's
  #   platform and the binary inside it instead, and is best-effort (ADR-0016).
  image:
    name: Image (${{ matrix.label }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false          # a failing armv7 leg must not cancel the required ones
      matrix:
        include:
          - label: amd64
            runner: ubuntu-latest
            platform: linux/amd64
            goarch: amd64
            smoke: true
          - label: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
            goarch: arm64
            smoke: true
          - label: armv7, best-effort
            runner: ubuntu-latest
            platform: linux/arm/v7
            goarch: arm
            goarm: "7"
            smoke: false
    env:
      PLATFORM: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false          # only for `go version -m` below; nothing compiles on the runner
      - name: Build ${{ matrix.platform }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          load: true
          tags: chadash:ci
          provenance: false
          build-args: |
            VERSION=dev
            COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=image-${{ matrix.goarch }}
          cache-to: type=gha,scope=image-${{ matrix.goarch }},mode=max
      - name: Image and binary match the platform
        # The binary is copied out, not run, so the armv7 leg gets this check
        # too. GOARM=7 proves the Dockerfile passed the variant through.
        env:
          WANT_GOARCH: ${{ matrix.goarch }}
          WANT_GOARM: ${{ matrix.goarm }}
        run: |
          fail() { echo "::error::$*"; exit 1; }
          got=$(docker image inspect -f '{{.Os}}/{{.Architecture}}' chadash:ci)
          [ "$got" = "linux/$WANT_GOARCH" ] || fail "The image is $got, not linux/$WANT_GOARCH"
          if [ -n "$WANT_GOARM" ]; then
            got=$(docker image inspect -f '{{.Variant}}' chadash:ci)
            [ "$got" = "v$WANT_GOARM" ] || fail "The image's variant is '$got', not v$WANT_GOARM"
          fi
          user=$(docker image inspect -f '{{.Config.User}}' chadash:ci)
          [ "$user" = "65532:65532" ] || fail "The image runs as '$user', not 65532:65532"

          id=$(docker create --platform "$PLATFORM" chadash:ci)
          docker cp "$id:/chadash" "$RUNNER_TEMP/chadash"
          docker rm "$id" >/dev/null
          settings=$(go version -m "$RUNNER_TEMP/chadash" | awk '$1 == "build" { print $2 }')
          echo "$settings"
          # -tags=webui exactly: also proves devlogin (bun run dev's one-click sign-in) isn't in.
          for want in GOOS=linux "GOARCH=$WANT_GOARCH" ${WANT_GOARM:+"GOARM=$WANT_GOARM"} CGO_ENABLED=0 -tags=webui; do
            grep -qxF -e "$want" <<<"$settings" || fail "The binary wasn't built with $want"
          done
      - name: Smoke test
        # Runs the image the way deploy/compose.yaml does: read-only, no
        # capabilities, a fresh /data volume. It must turn healthy and print a
        # setup token.
        if: matrix.smoke
        run: |
          docker run --rm chadash:ci version
          docker run -d --name chadash-smoke -p 127.0.0.1:3696:3696 \
            --read-only --tmpfs /tmp:size=64m,mode=1777 \
            --cap-drop ALL --security-opt no-new-privileges:true \
            chadash:ci
          healthy=
          for _ in $(seq 30); do
            if docker exec chadash-smoke /chadash healthcheck 2>/dev/null; then healthy=1; break; fi
            sleep 1
          done
          logs=$(docker logs chadash-smoke 2>&1)
          echo "$logs"
          if [ -z "$healthy" ]; then
            echo "::error::The hub never passed its healthcheck"
            exit 1
          fi
          if ! grep -q 'setup_token=cds_' <<<"$logs"; then
            echo "::error::No setup token in the first-run logs"
            exit 1
          fi
          if grep -q 'dev login is built in' <<<"$logs"; then
            echo "::error::The image was built with -tags devlogin"
            exit 1
          fi
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:3696/api/auth/dev-login)
          [ "$code" = 404 ] || { echo "::error::POST /api/auth/dev-login answered $code, want 404"; exit 1; }
          curl -fsS -o /dev/null http://127.0.0.1:3696/
      - name: Image-size budget
        # Per platform: each image on its own must fit.
        run: |
          bytes=$(docker save chadash:ci | gzip -6 | wc -c)
          mb=$(awk -v b="$bytes" 'BEGIN { printf "%.1f", b / 1000000 }')
          echo "Image ${PLATFORM}: ${mb} MB gzip (budget ${IMAGE_BUDGET_MB} MB)" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$bytes" -gt $((IMAGE_BUDGET_MB * 1000000)) ]; then
            echo "::error::The ${PLATFORM} image is over the ${IMAGE_BUDGET_MB} MB budget"
            exit 1
          fi
      - name: Build the node ${{ matrix.platform }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: node
          platforms: ${{ matrix.platform }}
          load: true
          tags: chadash-node:ci
          provenance: false
          build-args: |
            VERSION=dev
            COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=node-${{ matrix.goarch }}
          cache-to: type=gha,scope=node-${{ matrix.goarch }},mode=max
      - name: Node image and binary match the platform
        env:
          WANT_GOARCH: ${{ matrix.goarch }}
          WANT_GOARM: ${{ matrix.goarm }}
        run: |
          fail() { echo "::error::$*"; exit 1; }
          got=$(docker image inspect -f '{{.Os}}/{{.Architecture}}' chadash-node:ci)
          [ "$got" = "linux/$WANT_GOARCH" ] || fail "The node image is $got, not linux/$WANT_GOARCH"
          user=$(docker image inspect -f '{{.Config.User}}' chadash-node:ci)
          [ "$user" = "65532:65532" ] || fail "The node image runs as '$user', not 65532:65532"
          id=$(docker create --platform "$PLATFORM" chadash-node:ci)
          docker cp "$id:/chadash-node" "$RUNNER_TEMP/chadash-node"
          docker rm "$id" >/dev/null
          settings=$(go version -m "$RUNNER_TEMP/chadash-node" | awk '$1 == "build" { print $2 }')
          for want in GOOS=linux "GOARCH=$WANT_GOARCH" ${WANT_GOARM:+"GOARM=$WANT_GOARM"} CGO_ENABLED=0; do
            grep -qxF -e "$want" <<<"$settings" || fail "The node binary wasn't built with $want"
          done
          bytes=$(stat -c %s "$RUNNER_TEMP/chadash-node")
          mb=$(awk -v b="$bytes" 'BEGIN { printf "%.1f", b / 1000000 }')
          echo "chadash-node ${PLATFORM}: ${mb} MB (budget ${NODE_BINARY_BUDGET_MB} MB)" | tee -a "$GITHUB_STEP_SUMMARY"
          [ "$bytes" -le $((NODE_BINARY_BUDGET_MB * 1000000)) ] || fail "chadash-node is over the ${NODE_BINARY_BUDGET_MB} MB budget"
      - name: Node smoke test
        # As deploy/compose.yaml runs it, minus the socket and the hub: it must
        # start, wait for a pairing token, and report through its healthcheck.
        if: matrix.smoke
        run: |
          docker run --rm chadash-node:ci version
          docker run -d --name node-smoke --user 0:0 --group-add 65532 \
            --read-only --tmpfs /tmp:size=16m,mode=1777 \
            --cap-drop ALL --security-opt no-new-privileges:true \
            chadash-node:ci
          healthy=
          for _ in $(seq 30); do
            if docker exec node-smoke /chadash-node healthcheck 2>/dev/null; then healthy=1; break; fi
            sleep 1
          done
          logs=$(docker logs node-smoke 2>&1)
          echo "$logs"
          docker rm -f node-smoke >/dev/null
          [ -n "$healthy" ] || { echo "::error::The node never passed its healthcheck"; exit 1; }
          grep -q 'waiting for the hub' <<<"$logs" || { echo "::error::The node didn't wait for its pairing token"; exit 1; }

  # Real Linux numbers for the footprint spike, which so far has only macOS
  # upper bounds (ADR-0016). It checks the hub's RSS budgets (the empty hub;
  # the Demo Home with 20 tabs: spikes/footprint/budget_test.go) and fails
  # when one is over, but stays non-blocking: not a required check, until
  # the numbers are stable on shared runners. The full output is an
  # artifact, and the tables and budget lines go in the job summary.
  footprint:
    name: Footprint (${{ matrix.arch }}, non-blocking)
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    env:
      OUT: footprint-linux-${{ matrix.arch }}.txt
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Node binary size
        # ADR-0016 and ADR-0020: chadash-node at most 40 MB, stripped. The
        # node's idle RSS (also 40 MB) needs a real daemon; it's measured by
        # hand until a runner job can run one.
        run: |
          CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o "$RUNNER_TEMP/chadash-node" ./cmd/chadash-node
          bytes=$(stat -c %s "$RUNNER_TEMP/chadash-node")
          echo "Budget: chadash-node $(awk -v b="$bytes" 'BEGIN { printf "%.1f", b / 1000000 }') MB (at most ${NODE_BINARY_BUDGET_MB} MB)" | tee -a "$OUT"
          [ "$bytes" -le $((NODE_BINARY_BUDGET_MB * 1000000)) ] || { echo "::error::chadash-node is over budget"; exit 1; }
      - name: Measure the hub
        # About 9 minutes on an M4 Pro. Most of that is paced in real time (a
        # demo tick every 60 ms), so a slower runner shouldn't take much longer.
        run: |
          {
            echo "commit ${GITHUB_SHA}, runner image ${ImageOS:-?} ${ImageVersion:-?}"
            uname -srm
            echo "CPUs: $(nproc), page size: $(getconf PAGESIZE) B, $(lscpu | grep -m1 'Model name' | tr -s ' ')"
            free -m | sed -n 2p
            echo
          } > "$OUT"
          go test -tags footprint -run '^TestFootprint$' -timeout 35m -v ./spikes/footprint/ 2>&1 | tee -a "$OUT"
      - name: Summary
        if: always()
        run: |
          [ -f "$OUT" ] || exit 0
          { echo "### Footprint, linux/${{ matrix.arch }}"; sed -n '/^linux\//,/^Memory in MiB/p' "$OUT"; echo; sed -n 's/^Budget: /- /p' "$OUT"; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: footprint-linux-${{ matrix.arch }}
          path: ${{ env.OUT }}
          if-no-files-found: warn
