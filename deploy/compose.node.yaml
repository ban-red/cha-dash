# chadash-node on another Docker host: Cha Dash's hands there, for a hub
# that runs elsewhere on your network. Nothing listens here: the node dials
# the hub.
#
# It joins with a join token: in Cha Dash, Settings → Nodes → Add node makes
# one and shows a .env block for this host (CHADASH_HUB, CHADASH_NODE_NAME,
# CHADASH_NODE_TOKEN). Put it in .env next to this file, then:
#
#   docker compose -f compose.node.yaml up -d
#
# During the beta there's no `latest` image: add
# CHADASH_NODE_IMAGE=ghcr.io/ban-red/chadash-node:beta (or a pinned tag) to
# .env first. An override file isn't read when -f names this file.
#
# The node logs "waiting for approval in Cha Dash; fingerprint …" and waits.
# Compare the fingerprint in Settings → Nodes, then approve it there. Once it
# has joined, delete the CHADASH_NODE_TOKEN line: the token is single-use, and
# the node reconnects on its identity in the `node` volume. README, "Nodes on
# other hosts", has the details.
#
# Nodes that paired with CHADASH_PAIRING before v0.3 keep working; new ones
# should use a join token, which an admin approves.

name: chadash-node

services:
  chadash-node:
    image: ${CHADASH_NODE_IMAGE:-ghcr.io/ban-red/chadash-node:latest}
    restart: unless-stopped
    # As in compose.yaml: uid 0, the socket's owner, with every capability
    # dropped. To run it unprivileged instead: user "65532:65532" and
    # group_add with the gid from `stat -c %g /var/run/docker.sock`.
    user: "0:0"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777     # the healthcheck's state file
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - node:/etc/chadash-node      # its identity; add policy.yaml here (README)
      - /opt/stacks:/opt/stacks     # owned stacks; the same path inside and out, so compose's relative paths work
    #   - ./policy.yaml:/etc/chadash-node/policy.yaml:ro
    environment:
      CHADASH_NODE_HUB: ${CHADASH_HUB:?set CHADASH_HUB to the hub's ws://<host>:3696/node}
      CHADASH_NODE_NAME: ${CHADASH_NODE_NAME:?set CHADASH_NODE_NAME to what the hub should call this host}
      CHADASH_NODE_TOKEN: ${CHADASH_NODE_TOKEN:-}   # the join token; ignored once the node has joined
      CHADASH_NODE_PAIRING: ${CHADASH_PAIRING:-}    # nodes that paired before v0.3 only
    # To keep the token out of the environment, use a file instead:
    #   CHADASH_NODE_TOKEN_FILE: /run/secrets/chadash_node_token
    # The healthcheck comes from the image: `/chadash-node healthcheck`.

volumes:
  node:
