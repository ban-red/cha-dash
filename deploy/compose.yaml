# Cha Dash: the hub, plus chadash-node for this host's Docker.
#
#   docker compose up -d
#
# Then open http://<this host>:3696 and create the owner account (admin).
# Nothing else is required. Options, reverse proxies, backups and upgrades are
# in README.md next to this file. Put your own changes in compose.override.yaml,
# which Compose loads automatically, so this file can be replaced on upgrade.

name: chadash

services:
  chadash:
    image: ghcr.io/ban-red/chadash:latest
    restart: unless-stopped
    ports:
      - "3696:3696"
    volumes:
      - data:/data                  # database + vault key: back them up together
      - pairing:/pairing            # the hub writes the node's pairing token here
    environment:
      CHADASH_NODE_PAIRING_FILE: /pairing/token
    #   CHADASH_TRUSTED_PROXIES: 172.30.0.0/16   # behind a reverse proxy (README)
    #   CHADASH_PUBLIC_URL: https://dash.lab.example   # for passkeys, over HTTPS (README)
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777     # SQLite's temporary files; nothing else writes outside /data
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    # The hub never gets the Docker socket. The healthcheck comes from the
    # image: `/chadash healthcheck`.

  # chadash-node: reads and controls this host's Docker for the hub, within
  # its local policy (README, "The node"). It dials the hub over the compose
  # network and pairs with the token in the shared volume; nothing else can
  # pair. It holds the Docker socket; the hub never does. Delete this service
  # if you don't want Cha Dash to see this host's containers.
  chadash-node:
    image: ghcr.io/ban-red/chadash-node:latest
    restart: unless-stopped
    depends_on: [chadash]
    # The socket's group differs from host to host, so the node runs as uid 0
    # (the socket's owner) with every capability dropped, which works
    # everywhere. Group 65532 lets it read the pairing token and write its
    # identity. To run it unprivileged instead: user "65532:65532" and
    # group_add with the gid from `stat -c %g /var/run/docker.sock`.
    user: "0:0"
    group_add: ["65532"]
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777     # the healthcheck's state file
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - node:/etc/chadash-node      # its identity; add policy.yaml here (README)
      - pairing:/pairing:ro
      - /opt/stacks:/opt/stacks     # owned stacks; the same path inside and out, so compose's relative paths work
    environment:
      CHADASH_NODE_HUB: ws://chadash:3696/node
      CHADASH_NODE_NAME: local      # the hub reads this host as node://local
    # The healthcheck comes from the image: `/chadash-node healthcheck`.

volumes:
  data:
  node:
  pairing:
