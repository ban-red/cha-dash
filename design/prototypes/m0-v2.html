.thumbbar .badge{display:inline-grid;place-items:center;min-width:18px;height:18px;padding:0 5px;border-radius:var(--radius-full);background:var(--text);color:var(--text-inverse);font:600 10px/1 var(--font-num)}
.thumbbar .recent{max-width:120px;overflow:hidden;text-overflow:ellipsis}
html[data-compact] .screen{padding-bottom:150px}
html[data-view=wall] .thumbbar{display:none}

/* ───────────── Wall: the simplified level of detail ───────────── */
.wall{--wcols:16;display:grid;grid-template-columns:repeat(var(--wcols),minmax(0,1fr));grid-auto-rows:calc((100cqi - (var(--wcols) - 1) * var(--gutter)) / var(--wcols));gap:var(--gutter);container-type:inline-size;transform:translate(var(--shift-x,0px),var(--shift-y,0px))}
.wall-wrap{container:wall/inline-size;max-width:min(1600px,calc((100vh - 120px) * 16 / 9));margin:0 auto}
html[data-view=wall] .frame{max-width:none}
.w-head{grid-column:1/-1;grid-row:span 2;display:grid;grid-template-columns:auto minmax(0,1fr);gap:clamp(16px,3cqi,56px);align-items:end;padding-bottom:var(--space-3);border-bottom:var(--hairline) solid var(--line)}
.w-clock{font:700 clamp(64px,10.5cqi,170px)/.8 var(--font-clock);letter-spacing:.01em;font-variant-numeric:tabular-nums;color:var(--text)}
.w-date{margin-top:var(--space-3);font:var(--weight-medium) clamp(12px,1.25cqi,20px)/1 var(--font-num);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--text-3)}
.w-status{font:var(--weight-medium) clamp(22px,2.9cqi,48px)/1.12 var(--font-ui);letter-spacing:-.02em;text-wrap:balance;color:var(--text)}
html[data-briefing=headline] .w-status{font:var(--weight-regular) clamp(26px,3.4cqi,56px)/1.05 var(--font-head)}
.w-status .g{width:.55em;height:.55em;margin-right:.18em}
.w-status small{display:block;margin-top:.45em;font-size:.48em;line-height:1.3;letter-spacing:0;color:var(--text-2)}
.wt{position:relative;min-width:0;min-height:0;display:flex;flex-direction:column;gap:clamp(8px,1cqi,16px);padding:clamp(14px,1.5cqi,26px);background:var(--tile-bg);border:0 solid var(--tile-border-color);border-width:var(--tile-border-width);border-radius:var(--tile-radius);overflow:hidden}
:root[data-surface=ruled] .wt{padding-inline:1px}
.wt.is-attn{--tile-border-color:color-mix(in oklch,var(--attention) 50%,var(--line));box-shadow:inset 4px 0 0 var(--attention)}
.wt-k{display:flex;align-items:center;gap:10px;font:var(--weight-medium) clamp(12px,1.15cqi,19px)/1 var(--font-num);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--text-3)}
.wt-k .g{width:.85em;height:.85em}
.wt-v{font:var(--weight-medium) clamp(56px,9cqi,150px)/.86 var(--font-num);letter-spacing:-.05em;font-variant-numeric:var(--figures-display);color:var(--text)}
.wt-v .u{font-size:.36em;letter-spacing:0;color:var(--text-3)}
.wt-t{font:var(--weight-medium) clamp(16px,1.7cqi,28px)/1.25 var(--font-ui);color:var(--text)}
.wt-m{font:var(--weight-regular) clamp(13px,1.25cqi,21px)/1.3 var(--font-ui);color:var(--text-2)}
.wt .meter.thick{height:clamp(10px,1.1cqi,18px)}
.w-hosts{display:flex;flex-direction:column;gap:clamp(6px,.85cqi,14px);margin-top:auto}
.w-host{display:grid;grid-template-columns:minmax(0,1fr) 3.2em;gap:4px 10px;align-items:center;font:var(--weight-medium) clamp(12px,1.25cqi,20px)/1 var(--font-num);color:var(--text-2)}
.w-host .meter{grid-column:1/-1;height:clamp(5px,.55cqi,9px)}
.w-host b{font-weight:var(--weight-medium);text-align:right;color:var(--text)}
.w-host.attn{color:var(--text)}
.w-cam{flex:1;min-height:0;display:grid;grid-template-columns:2.4fr 1fr;grid-template-rows:1fr 1fr;gap:clamp(6px,.7cqi,12px)}
.w-cam .cam.big{grid-column:1;grid-row:1/3}
.w-cam .cam-cap{font-size:clamp(12px,1.3cqi,22px);bottom:clamp(8px,1cqi,16px);left:clamp(8px,1cqi,16px)}
.w-cam .cam-ts{font-size:clamp(9px,.85cqi,14px)}
.w-foot{grid-column:1/-1;grid-row:span 1;display:flex;align-items:center;justify-content:space-between;gap:var(--space-6);padding-top:var(--space-3);border-top:var(--hairline) solid var(--line);font:var(--weight-medium) clamp(12px,1.25cqi,20px)/1.2 var(--font-ui);color:var(--text-3)}
.w-foot b{font-weight:var(--weight-medium);color:var(--text-2)}
.w-note{font:var(--weight-medium) 10.5px/1.4 var(--font-num);letter-spacing:.04em;color:var(--text-3);text-align:right}
.w-hero{grid-column:span 8;grid-row:span 5}
.w-large{grid-column:span 4;grid-row:span 5}
@container wall (max-width:900px){ .wall{--wcols:8} .w-hero{grid-column:span 8} .w-large{grid-column:span 4} }
@container wall (max-width:560px){ .wall{--wcols:4} .w-hero,.w-large{grid-column:span 4;grid-row:span 4} .w-head{grid-row:span 3;grid-template-columns:1fr} .w-foot{grid-row:span 2;flex-direction:column;align-items:flex-start;justify-content:center;gap:var(--space-1)} }

/* ───────────── Workbench and motion study ───────────── */
.view-head{padding:var(--space-1) 2px var(--space-6);margin-bottom:var(--space-6);border-bottom:var(--hairline) solid var(--line)}
.wb .tile{padding-top:32px;cursor:default}
.wb .caption{position:absolute;z-index:2;left:10px;top:9px;padding:3px 5px;border-radius:var(--radius-xs);background:var(--surface-2);font:var(--weight-medium) 9.5px/1 var(--font-num);letter-spacing:.12em;text-transform:uppercase;color:var(--text-3)}
:root[data-surface=ruled] .wb .caption{left:1px;background:var(--text);color:var(--text-inverse)}
.wb .s-glyph{padding-top:26px}.wb .s-glyph .caption{top:6px;left:6px}
.wb .s-strip{padding-top:28px}
.legend{display:flex;flex-wrap:wrap;gap:var(--space-3) var(--space-6);font-size:var(--type-small);color:var(--text-2)}
.legend span{display:inline-flex;align-items:center;gap:var(--space-2)}
.legend .g{width:11px;height:11px}
.disks{display:grid;gap:5px}
.disk{display:grid;grid-template-columns:4.2em minmax(0,1fr) 2.6em 2.6em;gap:var(--space-2);align-items:center;font-size:var(--type-caption);color:var(--text-3)}
.disk .n{text-align:right;color:var(--text-2)}
.diskmap{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;align-items:end;height:100%}
.dm{display:flex;flex-direction:column;justify-content:flex-end;gap:5px;height:100%;min-width:0}
.dm .bar{position:relative;flex:1;overflow:hidden;border-radius:var(--radius-xs);background:color-mix(in oklch,var(--text-3) 18%,transparent)}
.dm .bar i{position:absolute;left:0;right:0;bottom:0;background:color-mix(in oklch,var(--text-3) 52%,transparent)}
.dm .bar.attn i{background:var(--attention)}
.dm .bar.par i{background:repeating-linear-gradient(135deg,var(--text-3) 0 3px,transparent 3px 6px)}
.dm small{text-align:center;white-space:nowrap;font:var(--weight-medium) 10px/1 var(--font-num);color:var(--text-3)}
.lod{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--gutter)}
@container board (max-width:1040px){ .lod{grid-template-columns:repeat(2,minmax(0,1fr))} }
@container board (max-width:640px){ .lod{grid-template-columns:1fr} }
.lod>div{display:flex;flex-direction:column;gap:var(--space-2)}
.lod .cap{font:var(--weight-medium) 9.5px/1 var(--font-num);letter-spacing:.12em;text-transform:uppercase;color:var(--text-3)}
.lod .box{flex:1;min-height:170px}
.ink{background:#fbfaf7 !important;color:#111 !important;border:1px solid #111 !important;border-radius:0 !important;box-shadow:none !important;font-family:var(--font-num)}
.ink *{color:#111 !important}
.ink .meter{color:#111;background:repeating-linear-gradient(90deg,#111 0 1px,transparent 1px 4px)}
.ink .m-tick{background:#111}

.motion-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--gutter)}
@container board (max-width:1040px){ .motion-grid{grid-template-columns:repeat(2,minmax(0,1fr))} }
@container board (max-width:640px){ .motion-grid{grid-template-columns:1fr} }
.mcard{display:flex;flex-direction:column;gap:var(--space-3);padding:var(--space-4);background:var(--tile-bg);border:0 solid var(--tile-border-color);border-width:var(--tile-border-width);border-radius:var(--tile-radius);min-width:0}
:root[data-surface=ruled] .mcard{padding-inline:1px}
.mcard h3{display:flex;align-items:baseline;gap:var(--space-2);margin:0;font:600 var(--type-callout)/1.2 var(--font-num);color:var(--text)}
.mcard h3 small{font:var(--weight-regular) var(--type-caption)/1 var(--font-num);color:var(--text-3)}
.mcard p{margin:0;font-size:var(--type-small);color:var(--text-3);line-height:1.4}
.curvebox{position:relative;height:96px}
.curve{position:absolute;inset:0;width:100%;height:100%;display:block;overflow:visible}
.cl{position:absolute;font:var(--weight-medium) 10px/1 var(--font-num);color:var(--text-3);white-space:nowrap}
.curve .ax{stroke:var(--line-2);stroke-width:1}
.curve .ln{fill:none;stroke:var(--text);stroke-width:1.75;vector-effect:non-scaling-stroke}
.curve .pd{stroke:var(--text-3);stroke-width:1;stroke-dasharray:2 3;vector-effect:non-scaling-stroke}
.stagebox{position:relative;height:120px;border:var(--hairline) dashed var(--line-2);border-radius:var(--radius-md);overflow:hidden}
.mblock{position:absolute;display:flex;align-items:center;justify-content:center;gap:6px;text-align:center;border-radius:var(--radius-md);background:var(--surface-2);border:var(--hairline) solid var(--line-2);font:var(--weight-medium) var(--type-caption)/1 var(--font-num);color:var(--text-2)}
.mvalue{position:absolute;inset:0;display:grid;place-items:center;font:var(--weight-medium) 56px/1 var(--font-num);letter-spacing:-.04em;color:var(--text)}
.mvalue .u{font-size:.4em;color:var(--text-3)}
.try{display:flex;flex-wrap:wrap;gap:var(--space-2)}

/* ───────────── Appearance studio (the theme engine) ───────────── */
.studio{position:fixed;z-index:55;top:0;right:0;bottom:0;width:384px;display:flex;flex-direction:column;border-width:0 0 0 var(--hairline);border-radius:0;transform:translateX(105%);visibility:hidden;transition:transform var(--motion-sheet-duration) var(--motion-sheet-easing),visibility 0s linear var(--motion-sheet-duration)}
html[data-studio-open] .studio{transform:none;visibility:visible;transition:transform var(--motion-sheet-duration) var(--motion-sheet-easing),visibility 0s}
@media (max-width:760px){ .studio{top:auto;left:0;width:auto;height:80dvh;border-width:var(--hairline) 0 0;border-radius:var(--radius-xl) var(--radius-xl) 0 0;transform:translateY(105%)} }
.st-head{display:flex;align-items:center;gap:var(--space-3);padding:var(--space-4) var(--space-4) var(--space-3);border-bottom:var(--hairline) solid var(--line)}
.st-head h2{margin:0;font:600 var(--type-callout)/1.1 var(--font-ui)}
.st-head p{margin:3px 0 0;font:var(--weight-regular) var(--type-caption)/1.3 var(--font-num);color:var(--text-3)}
.st-body{flex:1;overflow:auto;overscroll-behavior:contain;padding:var(--space-2) var(--space-4) var(--space-8)}
.st-sec{padding:var(--space-4) 0;border-bottom:var(--hairline) solid var(--line)}
.st-sec:last-child{border-bottom:0}
.st-sec h3{display:flex;align-items:center;gap:var(--space-2);margin:0 0 var(--space-3);font:var(--weight-medium) var(--type-micro)/1 var(--font-num);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--text-3)}
.st-sec h3 .sp{flex:1}
.themes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--space-2)}
.th-card{display:flex;flex-direction:column;gap:6px;padding:6px;border:var(--hairline) solid var(--line-2);border-radius:var(--radius-md);background:transparent;text-align:left}
.th-card[aria-pressed=true]{border-color:var(--text);box-shadow:0 0 0 1px var(--text)}
.th-card .pv{position:relative;height:58px;overflow:hidden;border-radius:var(--radius-sm);background:var(--pv-bg);box-shadow:inset 0 0 0 1px var(--pv-line)}
.th-card .pv i{position:absolute;display:block}
.th-card .pv .tile-p{left:8px;top:8px;width:58%;height:42px;border-radius:var(--pv-r);background:var(--pv-surface);box-shadow:inset 0 0 0 1px var(--pv-line)}
.th-card .pv .t1{left:15px;top:15px;width:30%;height:5px;border-radius:2px;background:var(--pv-text)}
.th-card .pv .t2{left:15px;top:25px;width:44%;height:4px;border-radius:2px;background:var(--pv-text3)}
.th-card .pv .a{right:22px;top:12px;width:0;height:0;border-left:6px solid transparent;border-right:6px solid transparent;border-bottom:11px solid var(--pv-att)}
.th-card .pv .d{right:22px;top:31px;width:11px;height:11px;border-radius:2px;background:var(--pv-down)}
.th-card .pv .p{right:8px;bottom:8px;width:24px;height:4px;border-radius:2px;background:var(--pv-acc)}
.th-card .nm{padding:0 2px 2px;font:var(--weight-medium) var(--type-caption)/1.2 var(--font-ui);color:var(--text)}
.th-card .nm small{display:block;font-weight:var(--weight-regular);color:var(--text-3)}
.ctl{display:grid;grid-template-columns:76px minmax(0,1fr) 46px;gap:var(--space-2);align-items:center;margin:0 0 var(--space-2)}
.ctl label{font-size:var(--type-small);color:var(--text-2)}
.ctl output{text-align:right;font:var(--weight-medium) var(--type-caption)/1 var(--font-num);color:var(--text-3)}
.ctl input[type=range]{width:100%;height:22px;margin:0;background:transparent;-webkit-appearance:none;appearance:none}
.ctl input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:var(--track,var(--surface-active));box-shadow:inset 0 0 0 1px var(--line)}
.ctl input[type=range]::-moz-range-track{height:6px;border-radius:3px;background:var(--track,var(--surface-active))}
.ctl input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;margin-top:-5px;border-radius:50%;background:var(--surface);border:2px solid var(--text);box-shadow:0 1px 3px #0004}
.ctl input[type=range]::-moz-range-thumb{width:13px;height:13px;border-radius:50%;background:var(--surface);border:2px solid var(--text)}
.swatchrow{display:flex;align-items:center;gap:var(--space-2);margin:0 0 var(--space-3)}
.swatch{width:26px;height:26px;flex:none;border-radius:var(--radius-sm);box-shadow:inset 0 0 0 1px var(--line-2)}
.swatchrow code{font:var(--weight-medium) var(--type-caption)/1.3 var(--font-num);color:var(--text-2)}
.seg{display:flex;padding:2px;border-radius:calc(var(--radius-md) + 2px);background:color-mix(in oklch,var(--text) 7%,transparent)}
.seg button{flex:1;padding:6px 9px;border:0;border-radius:var(--radius-md);background:transparent;font:var(--weight-medium) var(--type-caption)/1 var(--font-ui);color:var(--text-2);white-space:nowrap}
.seg button[aria-pressed=true]{background:var(--surface);color:var(--text);box-shadow:0 0 0 var(--hairline) var(--line-2),0 1px 2px #0002}
.seg button:disabled{opacity:.55;cursor:not-allowed}
.import-src{margin:var(--space-3) 0 var(--space-2)}
.import-src .seg{max-width:520px}
.import-src .seg .n{margin-left:6px;color:var(--text-3);font-weight:var(--weight-regular)}
.opt{display:grid;grid-template-columns:76px minmax(0,1fr);gap:var(--space-2);align-items:center;margin:0 0 var(--space-2)}
.opt>span{font-size:var(--type-small);color:var(--text-2)}
.verdict{display:flex;gap:var(--space-2);align-items:flex-start;margin:0 0 var(--space-3);padding:10px 12px;border-radius:var(--radius-md);border:var(--hairline) solid var(--line-2);font-size:var(--type-small);line-height:1.4;color:var(--text)}
.verdict .g{margin-top:3px}
.verdict.bad{border-color:color-mix(in oklch,var(--down) 60%,var(--line));background:var(--down-bg)}
.checks{display:flex;flex-direction:column}
.ck{display:grid;grid-template-columns:14px minmax(0,1fr) auto;gap:var(--space-2);align-items:baseline;padding:5px 0;border-top:var(--hairline) solid var(--line);font-size:var(--type-caption);color:var(--text-2)}
.ck .val{font:var(--weight-medium) var(--type-caption)/1 var(--font-num);color:var(--text);white-space:nowrap}
.ck .val small{color:var(--text-3);font-weight:var(--weight-regular)}
.ck .ic{width:10px;height:10px;align-self:center}
.ck.fail .ic{color:var(--down)}.ck.pass .ic{color:var(--text-3)}.ck.info .ic{color:var(--text-3)}.ck.warn .ic{color:var(--attention)}
.ck.fail{color:var(--text)}
.ck-grp{margin:var(--space-3) 0 2px;font:var(--weight-medium) 9.5px/1 var(--font-num);letter-spacing:.12em;text-transform:uppercase;color:var(--text-3)}
.scales{display:grid;grid-template-columns:52px repeat(12,minmax(0,1fr));gap:2px;align-items:center}
.scales .lb{font:var(--weight-medium) 9.5px/1 var(--font-num);color:var(--text-3)}
.scales .hd{text-align:center;font:var(--weight-medium) 8.5px/1 var(--font-num);color:var(--text-3)}
.scales i{display:block;height:20px;border-radius:2px;box-shadow:inset 0 0 0 1px color-mix(in oklch,var(--text) 6%,transparent)}
.st-actions{display:flex;flex-wrap:wrap;gap:var(--space-2)}
.export{display:none;margin-top:var(--space-3);width:100%;height:220px;padding:10px;resize:vertical;border:var(--hairline) solid var(--line-2);border-radius:var(--radius-md);background:var(--surface);font:var(--weight-regular) var(--type-caption)/1.5 var(--font-num);color:var(--text-2)}
.export.on{display:block}
.studio details summary{cursor:pointer;list-style:none;font-size:var(--type-small);color:var(--text-2)}
.studio details summary::before{content:"▸ ";color:var(--text-3)}
.studio details[open] summary::before{content:"▾ ";}

/* ───────────── Prototype controls (not part of the design) ───────────── */
.proto{position:fixed;z-index:50;left:0;right:0;bottom:14px;margin:0 auto;width:max-content;max-width:calc(100vw - 16px);display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:6px 8px;padding:6px;border-radius:var(--radius-lg);font:var(--weight-medium) var(--type-caption)/1 var(--font-ui)}
html[data-studio-open] .proto{right:384px;max-width:calc(100vw - 400px)}
@media (max-width:1179px){ html[data-studio-open] .proto{display:none} }
.proto .lab{padding:0 2px 0 6px;font:var(--weight-medium) 9px/1 var(--font-num);letter-spacing:.13em;text-transform:uppercase;color:var(--text-3)}
.proto .seg{flex:none}
.proto .seg button{flex:none;padding:6px 9px}
.dots{display:flex;gap:4px;padding:0 4px}
.dot{width:22px;height:22px;padding:0;border-radius:50%;border:0;background:radial-gradient(circle,var(--d-att) 0 2.6px,transparent 3.1px),linear-gradient(135deg,var(--d-bg) 0 50%,var(--d-surface) 50% 100%);box-shadow:inset 0 0 0 1.5px var(--d-text),0 0 0 1px var(--line-2)}
.dot[aria-pressed=true]{box-shadow:inset 0 0 0 1.5px var(--d-text),0 0 0 2px var(--bg),0 0 0 3.5px var(--text)}
.proto .collapse svg{width:10px;height:10px}
.proto .kb{padding:6px 8px;border:0;background:none;font:var(--weight-medium) 10.5px/1 var(--font-num);color:var(--text-3)}
.proto .studio-btn{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border:var(--hairline) solid var(--line-2);border-radius:var(--radius-md);background:var(--surface);color:var(--text)}
.proto .studio-btn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.6}
.proto .collapse{width:26px;height:26px;padding:0;border:0;border-radius:50%;background:none;color:var(--text-3)}
html[data-proto=min] .proto>:not(.collapse):not(.studio-btn){display:none}
@media (max-width:980px){ .proto .lab{display:none} .proto{gap:4px;padding:4px} .proto .seg button{padding:5px 7px} }
@media (max-width:640px){ .proto{bottom:auto;top:8px;right:8px;left:auto;margin:0;max-width:calc(100vw - 16px)} }

/* reduced motion: everything crossfades (JS-driven springs check this too) */
@media (prefers-reduced-motion:reduce){ html:not([data-motion=full]) *{scroll-behavior:auto} html:not([data-motion=full]) .tile:active,html:not([data-motion=full]) .btn:active{transform:none} }
html[data-motion=reduced] .tile:active,html[data-motion=reduced] .btn:active{transform:none}
::view-transition-group(*){animation-duration:var(--motion-move-duration);animation-timing-function:var(--motion-move-easing)}
::view-transition-old(root),::view-transition-new(root){animation-duration:var(--motion-fade-duration)}
</style>
</head>
<body>
<div class="app">

  if (!isObj(d.typography)) err('typography', 'is required');
  else {
    noExtra(d.typography, 'typography', ['ui', 'numeral', 'clock', 'headline']);
    for (const k of ['ui', 'numeral', 'clock', 'headline']) {
      const f = d.typography[k];
      if (typeof f !== 'string' || !(f in FONTS)) err(`typography.${k}`, `must be a bundled font: ${Object.keys(FONTS).join(', ')}`);
    }
  }
  oneOf(d.surface, 'surface', 'surface');
  if (!isObj(d.shape)) err('shape', 'is required (radius, hairline)');
  else { noExtra(d.shape, 'shape', ['radius', 'hairline']); num(d.shape.radius, 'shape.radius', 0, 12); num(d.shape.hairline, 'shape.hairline', 0.5, 2); }
  oneOf(d.density, 'density', 'density');
  oneOf(d.briefing, 'briefing', 'briefing');
  if (!isObj(d.material)) err('material', 'is required (frosted)');
  else { noExtra(d.material, 'material', ['frosted']); num(d.material.frosted, 'material.frosted', 0, 1); }
  oneOf(d.backdrop, 'backdrop', 'backdrop');
  return errs;
}

/* ═══════════════════════════ 5 · The generator ═══════════════════════════ */

/* Lightness offsets from the base for steps 1-10, before the contrast factor.
   1 app background · 2 surface (cards) · 3-5 component states · 6-8 borders · 9-10 solid fills.
   Elevation is lighter in dark mode. In light mode cards are lighter than the
   page (step 2 > step 1) and states go darker from there. */
const OFFSETS = {
  dark: [0, 0.032, 0.07, 0.1, 0.13, 0.165, 0.215, 0.3, 0.35, 0.395],
  light: [0, 0.03, -0.025, -0.05, -0.075, -0.1, -0.14, -0.22, -0.3, -0.335],
};
/* Chroma of chromatic steps 1-8 as a fraction of the solid (step 9). */
const TINT = [0.05, 0.09, 0.16, 0.24, 0.32, 0.4, 0.52, 0.72];
/* Default status lightness per scheme: the M0 validated pairs (02-experience -> Color). */
const STATUS_L = { dark: { attention: 0.74, down: 0.64, maintenance: 0.72 }, light: { attention: 0.66, down: 0.55, maintenance: 0.52 } };
/* APCA targets for text: [primary, secondary, tertiary]. Standard = body Lc 90 / 75, labels Lc 60
   (02-experience -> Accessibility). Dim is Night's profile: a red, low-luminance
   ambient mode where Lc 60+ is physically out of reach; see design/tokens/README.md. */
const TARGETS = { standard: [90, 75, 60], dim: [38, 30, 24] };
const BOOST = [14, 15, 15];

/* WCAG 2 AA floor for text, per profile. Dim themes meet it too: WCAG 2.2 AA
   is a release gate (02-experience -> Accessibility), and red on black reaches
   4.5:1 even where it can't reach Lc 60. */
const WCAG_TEXT = { standard: 4.5, dim: 4.5 };
/* Per text level [primary, secondary, tertiary]. In the dim profile the APCA
   targets are out of reach, so the AA floor alone would put text-2 and text-3
   at about the same 4.5:1. These floors keep three visible levels, all AA. */
const WCAG_TEXT_LEVELS = { standard: [4.5, 4.5, 4.5], dim: [6.4, 5.4, 4.5] };
/* WCAG 2 AA for text (1.4.3). */
const WCAG_AA = 4.5;

/**
 * Solve for the lightness (in the text direction, closest to the backgrounds)
 * whose colour reaches |Lc| >= target on every background in `bgs` and a WCAG
 * ratio >= wcagMin on every background in `wcagBgs` (by default the same).
 * Both are monotone in L along the search direction, as long as `from` is
 * beyond every background.
 * @param {number} target @param {string[]} bgs @param {number} hue @param {number} chroma
 * @param {1 | -1} dir +1 = lighter text (dark scheme), -1 = darker text
 * @param {number} from lightness to search from
 * @param {number} wcagMin
 * @param {string[]} [wcagBgs]
 * @returns {{ col: Oklch, reached: boolean }}
 */
function solveText(target, bgs, hue, chroma, dir, from, wcagMin, wcagBgs = bgs) {
  /** @param {number} l */
  const at = (l) => canon({ l, c: chroma, h: hue });
  /** @param {number} l */
  const ok = (l) => {
    const hx = toHex(at(l));
    return bgs.every((b) => Math.abs(apca(hx, b)) >= target) && wcagBgs.every((b) => wcag(hx, b) >= wcagMin);
  };
  const end = dir > 0 ? 1 : 0;
  if (!ok(end)) return { col: at(end), reached: false };
  let near = from, far = end;
  for (let i = 0; i < 32; i++) {
    const mid = (near + far) / 2;
    if (ok(mid)) far = mid; else near = mid;
  }
  // round in the safe direction so canonical rounding can't drop below target
  let l = dir > 0 ? Math.ceil(far * 1e4) / 1e4 : Math.floor(far * 1e4) / 1e4;
  while (!ok(l) && l !== end) l = clamp(round(l + dir * 0.0001, 4), 0, 1);
  return { col: at(l), reached: true };
}

/**
 * Push a mark colour away from its backgrounds until it clears a WCAG ratio
 * (snap-to-passing: hold the hue, move the lightness). Bounded to +-0.1 L.
 * @param {Oklch} col @param {string[]} bgs @param {number} min @param {1 | -1} dir
 */
function snapContrast(col, bgs, min, dir) {
  let c = canon(col);
  for (let i = 0; i < 20; i++) {
    const hx = toHex(c);
    if (bgs.every((b) => wcag(hx, b) >= min)) return { col: c, moved: round(c.l - col.l, 4) };
    c = canon({ ...c, l: c.l + dir * 0.005 });
  }
  return { col: c, moved: round(c.l - col.l, 4) };
}

/** @param {Oklch} c @param {number} [alpha] @returns {OklchA} */
const A = (c, alpha = 1) => ({ ...c, alpha });

/**
 * Generate a chromatic 12-step scale around a solid (step 9). Its text steps
 * (11, 12) also clear WCAG AA on the scale's own tint (step 3, the `-bg`
 * token), so `attention-text` reads on `attention-bg`.
 * @param {Oklch} solid @param {number[]} ls lightness of neutral steps 1-8
 * @param {'light' | 'dark'} scheme @param {string[]} bgs @param {number[]} tg [t1, t3]
 * @param {number} wcagMin
 */
function chromaticScale(solid, ls, scheme, bgs, tg, wcagMin) {
  const dir = scheme === 'dark' ? 1 : -1;
  /** @type {Oklch[]} */
  const s = [];
  for (let i = 0; i < 8; i++) s.push(canon({ l: ls[i], c: solid.c * TINT[i], h: solid.h }));
  s.push(canon(solid));
  s.push(canon({ l: solid.l + dir * 0.045, c: solid.c, h: solid.h }));
  const wbgs = [...bgs, toHex(s[2])];
  const bgL = wbgs.map((b) => hexToOklch(b).l);
  const start = dir > 0 ? Math.max(...bgL) : Math.min(...bgL);
  s.push(solveText(tg[1], bgs, solid.h, solid.c * 0.85, dir, start, wcagMin, wbgs).col);
  s.push(solveText(tg[0], bgs, solid.h, Math.min(solid.c * 0.3, 0.06), dir, start, wcagMin, wbgs).col);
  return s;
}

/**
 * Spring step response, SwiftUI model (WWDC23): duration is the perceptual
 * duration (sets stiffness), bounce 0 = critically damped.
 * @param {number} duration seconds @param {number} bounce 0..0.9
 */
function spring(duration, bounce) {
  const omega = (2 * Math.PI) / duration;
  const zeta = 1 - clamp(bounce, 0, 0.9);
  /** displacement from target at t, starting at 1 with velocity v0 (units/s toward target) @param {number} t @param {number} [v0] */
  const state = (t, v0 = 0) => {
    const d0 = -v0;
    if (zeta >= 1) {
      const B = d0 + omega;
      const e = Math.exp(-omega * t);
      return { x: e * (1 + B * t), v: e * (B - omega * (1 + B * t)) };
    }
    const wd = omega * Math.sqrt(1 - zeta * zeta);
    const B = (d0 + zeta * omega) / wd;
    const e = Math.exp(-zeta * omega * t);
    const cos = Math.cos(wd * t), sin = Math.sin(wd * t);
    return { x: e * (cos + B * sin), v: e * (-zeta * omega * (cos + B * sin) + (-wd * sin + B * wd * cos)) };
  };
  // settle: just after the last time |displacement| >= 0.001 (1 ms resolution), rounded up to 10 ms
  let last = 0;
  for (let ms = 1; ms <= duration * 6000; ms++) if (Math.abs(state(ms / 1000).x) >= 0.001) last = ms;
  const settle = Math.max(duration, Math.ceil((last + 1) / 10) / 100);
  const n = 40;
  const pts = Array.from({ length: n + 1 }, (_, i) => round(1 - state((settle * i) / n).x, 4));
  pts[0] = 0; pts[n] = 1;
  return { duration, bounce, omega, zeta, settle, easing: `linear(${pts.join(', ')})`, state };
}

/** Motion tokens (02-experience -> Motion). Durations in seconds. */
const MOTION = Object.freeze({
  press: { duration: 0.2, bounce: 0 },
  move: { duration: 0.35, bounce: 0 },
  lift: { duration: 0.3, bounce: 0.15 },
  sheet: { duration: 0.45, bounce: 0.08 },
});

/** @param {number} px */
const px = (px) => `${round(px, 2)}px`;

/**
 * Global (theme-independent) tokens: type scale, leading, tracking, spacing,
 * layout, motion. Emitted once on :root.
 * @returns {Record<string, string>}
 */
function globalTokens() {
  /** @type {Record<string, string>} */
  const t = {};
  // Type: a 1.125 modular scale on a 14px body, rounded to half pixels. Roles, not sizes.
  /** @param {number} step */
  const ts = (step) => px(Math.round(14 * 1.125 ** step * 2) / 2);
  Object.assign(t, {
    '--type-micro': ts(-3), '--type-caption': ts(-2), '--type-small': ts(-1), '--type-body': ts(0),
    '--type-callout': ts(1), '--type-title': ts(2), '--type-title-2': ts(4), '--type-headline': ts(6),
    '--type-value': ts(7), '--type-value-lg': ts(9), '--type-display': ts(11), '--type-clock': ts(12),
    '--type-wall': ts(15), '--type-wall-hero': ts(19),
    '--leading-tight': '1.08', '--leading-snug': '1.24', '--leading-normal': '1.4', '--leading-relaxed': '1.52',
    '--tracking-caps': '0.15em', '--tracking-display': '-0.02em', '--tracking-value': '-0.035em', '--tracking-ui': '-0.006em',
    '--weight-regular': '400', '--weight-medium': '500', '--weight-semibold': '600',
  });
  // Spacing: 4pt scale
  for (const [k, v] of [['0-5', 2], ['1', 4], ['1-5', 6], ['2', 8], ['3', 12], ['4', 16], ['5', 20], ['6', 24], ['8', 32], ['10', 40], ['12', 48], ['16', 64]]) {
    t[`--space-${k}`] = px(/** @type {number} */ (v));
  }
  // Layout (comfortable density)
  Object.assign(t, {
    '--gutter': '12px', '--section-gap': '30px', '--tile-pad-x': '14px', '--tile-pad-y': '12px', '--tile-gap': '7px',
    '--unit-min': '76px', '--unit-max': '96px', '--target-min': '44px',
    // 12 desktop columns at the largest unit; follows density because it's derived
    '--board-max': 'calc(12 * var(--unit-max) + 11 * var(--gutter))',
  });
  // Motion: springs as CSS linear() easings sampled from the physics, plus the two tweens
  for (const [name, m] of Object.entries(MOTION)) {
    const s = spring(m.duration, m.bounce);
    t[`--motion-${name}-duration`] = `${Math.round(s.settle * 1000)}ms`;
    t[`--motion-${name}-easing`] = s.easing;
  }
  t['--motion-value-duration'] = '600ms';
  t['--motion-value-easing'] = 'cubic-bezier(0.22, 1, 0.36, 1)';
  t['--motion-fade-duration'] = '150ms';
  t['--motion-fade-easing'] = 'ease';
  return t;
}

/** Variant blocks keyed by attribute, plus the media-query equivalents. */
function variantTokens() {
  const motion = Object.keys(MOTION).concat(['value']);
  /** @param {string} dur @param {string} ease */
  const allMotion = (dur, ease) => Object.fromEntries(motion.flatMap((k) => [[`--motion-${k}-duration`, dur], [`--motion-${k}-easing`, ease]]));
  return {
    density: {
      compact: { '--gutter': '8px', '--section-gap': '22px', '--tile-pad-x': '11px', '--tile-pad-y': '9px', '--tile-gap': '5px', '--unit-min': '64px', '--unit-max': '80px' },
    },
    surface: {
      card: { '--tile-bg': 'var(--surface)', '--tile-border-width': 'var(--hairline)', '--tile-border-color': 'var(--line)', '--tile-radius': 'var(--radius-md)', '--tile-pad-inline': 'var(--tile-pad-x)', '--section-rule-width': 'var(--hairline)', '--section-rule-color': 'var(--line)' },
      ruled: { '--tile-bg': 'transparent', '--tile-border-width': 'var(--hairline) 0 0', '--tile-border-color': 'var(--line-2)', '--tile-radius': '0px', '--tile-pad-inline': '1px', '--section-rule-width': '2px', '--section-rule-color': 'var(--text)' },
      flat: { '--tile-bg': 'var(--surface)', '--tile-border-width': '0px', '--tile-border-color': 'transparent', '--tile-radius': 'var(--radius-md)', '--tile-pad-inline': 'var(--tile-pad-x)', '--section-rule-width': 'var(--hairline)', '--section-rule-color': 'var(--line)' },
    },
    motion: {
      reduced: allMotion('var(--motion-fade-duration)', 'var(--motion-fade-easing)'),
      none: allMotion('0.01ms', 'linear'),
    },
    material: {
      solid: { '--glass-bg': 'var(--surface)', '--glass-blur': '0px' },
    },
  };
}

/** The theme-level token names, in emission order (every theme defines all of them). */
function themeTokenNames() {
  const names = [];
  for (const s of ['neutral', 'accent', 'attention', 'down', 'maint']) for (let i = 1; i <= 12; i++) names.push(`--${s}-${i}`);
  names.push(...SEMANTIC.map(([n]) => `--${n}`));
  names.push('--font-ui', '--font-num', '--font-clock', '--font-head', '--figures-display',
    '--radius-xs', '--radius-sm', '--radius-md', '--radius-lg', '--radius-xl', '--radius-full', '--hairline',
    '--tile-bg', '--tile-border-width', '--tile-border-color', '--tile-radius', '--tile-pad-inline', '--section-rule-width', '--section-rule-color',
    '--glass-bg', '--glass-blur', '--backdrop', '--shadow-lift', '--shadow-overlay');
  return names;
}

/* Semantic colour map: [token, scale or derived source]. Components use only these. */
/** @type {[string, string][]} */
const SEMANTIC = [
  ['bg', 'neutral.1'], ['surface', 'neutral.2'], ['surface-2', 'neutral.3'], ['surface-hover', 'neutral.4'], ['surface-active', 'neutral.5'],
  ['border', 'neutral.6'], ['border-strong', 'neutral.7'],
  ['line', 'ink/line'], ['line-2', 'ink/line2'],
  ['text', 'neutral.12'], ['text-2', 'text2'], ['text-3', 'neutral.11'], ['text-inverse', 'neutral.1'],
  ['accent', 'accent.9'], ['accent-hover', 'accent.10'], ['accent-text', 'accent.11'], ['accent-bg', 'accent.3'], ['accent-line', 'accent.7'], ['on-accent', 'on/accent.9'],
  ['progress', 'accent.9'],
  ['attention', 'attention.9'], ['attention-text', 'attention.11'], ['attention-bg', 'attention.3'], ['attention-line', 'attention.7'], ['on-attention', 'on/attention.9'],
  ['down', 'down.9'], ['down-text', 'down.11'], ['down-bg', 'down.3'], ['down-line', 'down.7'], ['on-down', 'on/down.9'],
  ['maint', 'maint.9'], ['maint-text', 'maint.11'], ['maint-bg', 'maint.3'],
  ['focus', 'text2'],
  ['spark', 'ink/spark'], ['band', 'ink/band'], ['hatch', 'ink/hatch'], ['scrim', 'bg/scrim'],
];

/**
 * Resolve a theme document into scales, semantic colours and CSS tokens.
 * Throws if the document is invalid; call validateThemeDoc first for messages.
 * @param {ThemeDoc} doc @returns {ResolvedTheme}
 */
function resolveTheme(doc) {
  const errors = validateThemeDoc(doc);
  if (errors.length) throw new Error(`invalid theme "${doc && doc.id}": ${errors.map((e) => `${e.path}: ${e.message}`).join('; ')}`);
  const base = /** @type {OklchA} */ (parseColor(doc.color.base));
  const accent = /** @type {OklchA} */ (parseColor(doc.color.accent));
  const scheme = base.l < 0.5 ? 'dark' : 'light';
  const dir = /** @type {1 | -1} */ (scheme === 'dark' ? 1 : -1);
  const profile = doc.profile ?? 'standard';
  const wmin = WCAG_TEXT[profile];
  const contrast = doc.color.contrast;
  const k = 0.8 + 0.4 * (contrast / 100);
  const boost = Math.max(0, (contrast - 50) / 50);
  const tgBase = TARGETS[profile];
  const tg = tgBase.map((t, i) => t + BOOST[i] * boost);
  const ink = doc.color.ink ?? { hue: base.h, chroma: Math.min(0.03, base.c * 1.6) };
  /** @type {string[]} */
  const notes = [];

  // ── neutral scale
  const offs = OFFSETS[scheme];
  const ls = offs.map((o, i) => clamp(base.l + (i === 0 ? 0 : o * k), 0, 1));
  /** @param {number} t */
  const neutralAt = (t) => ({ c: lerp(base.c, ink.chroma, t), h: base.c < 0.0005 ? ink.hue : lerpHue(base.h, ink.hue, t) });
  /** @type {Oklch[]} */
  const neutral = ls.map((l, i) => canon({ l, ...neutralAt(i / 11) }));
  const bgs = [toHex(neutral[0]), toHex(neutral[1])];
  // Text and text-2 also sit on raised rows and hover states (surface-2,
  // surface-hover): APCA aims at bg and surface, WCAG AA holds on all four.
  // text-3 is for labels on bg and surface only (see TEXT_PAIRS).
  const textBgs = neutral.slice(0, 4);
  const wbgs = textBgs.map((c) => toHex(c));
  const start = dir > 0 ? Math.max(neutral[0].l, neutral[1].l) : Math.min(neutral[0].l, neutral[1].l);
  const startAll = dir > 0 ? Math.max(...textBgs.map((c) => c.l)) : Math.min(...textBgs.map((c) => c.l));
  const [w1, w2, w3] = WCAG_TEXT_LEVELS[profile];
  const n11 = solveText(tg[2], bgs, neutralAt(10 / 11).h, neutralAt(10 / 11).c, dir, start, w3);
  const n12 = solveText(tg[0], bgs, ink.hue, ink.chroma, dir, startAll, w1, wbgs);
  const t2 = solveText(tg[1], bgs, neutralAt(10.5 / 11).h, neutralAt(10.5 / 11).c, dir, startAll, w2, wbgs);
  for (const [nm, r, t] of /** @type {[string, {reached: boolean}, number][]} */ ([['text-3', n11, tg[2]], ['text-2', t2, tg[1]], ['text', n12, tg[0]]])) {
    if (!r.reached) notes.push(`${nm}: Lc ${round(t, 1)} is out of reach on these surfaces; using the extreme lightness`);
  }
  // keep step 11 beyond step 10 so the scale stays monotone in the text direction
  let c11 = n11.col;
  if ((c11.l - neutral[9].l) * dir < 0.04) c11 = canon({ ...c11, l: neutral[9].l + dir * 0.04 });
  neutral.push(c11, n12.col);

  // ── accent and status scales
  const lsTint = ls.slice(0, 8);
  const tgScale = [tg[0], tg[2]];
  const scales = /** @type {Record<ScaleName, Oklch[]>} */ ({ neutral });
  scales.accent = chromaticScale(canon(accent), lsTint, scheme, bgs, tgScale, wmin);
  /** @type {Record<string, { col: Oklch, moved: number }>} */
  const statusSolid = {};
  for (const key of /** @type {const} */ (['attention', 'down', 'maintenance'])) {
    const spec = doc.color.status[key];
    const want = { l: spec.l ?? STATUS_L[scheme][key], c: spec.chroma, h: spec.hue };
    statusSolid[key] = doc.monochrome ? { col: canon(want), moved: 0 } : snapContrast(want, bgs, THRESHOLDS.markContrast, dir);
    if (statusSolid[key].moved) notes.push(`${key}: lightness moved ${statusSolid[key].moved > 0 ? '+' : ''}${statusSolid[key].moved} to clear ${THRESHOLDS.markContrast}:1 on the surfaces`);
  }
  scales.attention = chromaticScale(statusSolid.attention.col, lsTint, scheme, bgs, tgScale, wmin);
  scales.down = chromaticScale(statusSolid.down.col, lsTint, scheme, bgs, tgScale, wmin);
  scales.maint = chromaticScale(statusSolid.maintenance.col, lsTint, scheme, bgs, tgScale, wmin);

  // ── semantic colours
  const inkCol = neutral[11];
  // hairlines: quiet up to contrast 70, then they firm up quickly (High Contrast, prefers-contrast: more)
  const lineA = round(0.045 + 0.09 * (contrast / 100) + 0.12 * Math.max(0, (contrast - 70) / 30), 3);
  /** @type {Record<string, OklchA>} */
  const derived = {
    'text2': A(t2.col),
    'ink/line': A(inkCol, lineA),
    'ink/line2': A(inkCol, round(lineA * 1.9, 3)),
    'ink/spark': A(inkCol, 0.55),
    'ink/band': A(inkCol, scheme === 'dark' ? 0.065 : 0.07),
    'ink/hatch': A(inkCol, scheme === 'dark' ? 0.075 : 0.08),
    'bg/scrim': A(neutral[0], scheme === 'dark' ? 0.6 : 0.5),
  };
  /**
   * Text on a solid: the end of the neutral scale APCA prefers, unless it
   * misses WCAG AA and the other end doesn't (mid-tone ambers and reds, where
   * the two models disagree). When neither end reaches AA, the ink is pushed
   * towards black or white, whichever the solid allows, until it does.
   * @param {Oklch} solid
   */
  const onColor = (solid) => {
    const hx = toHex(solid);
    const [pick, other] = Math.abs(apca(toHex(neutral[0]), hx)) >= Math.abs(apca(toHex(neutral[11]), hx)) ? [neutral[0], neutral[11]] : [neutral[11], neutral[0]];
    if (wcag(toHex(pick), hx) >= WCAG_AA) return A(pick);
    if (wcag(toHex(other), hx) >= WCAG_AA) return A(other);
    const toDark = wcag('#000000', hx) >= wcag('#ffffff', hx);
    return A(solveText(0, [hx], ink.hue, ink.chroma, toDark ? -1 : 1, solid.l, WCAG_AA).col);
  };
  /** @type {Record<string, OklchA>} */
  const colors = {};
  for (const [name, src] of SEMANTIC) {
    if (src.startsWith('on/')) {
      const [sc, st] = src.slice(3).split('.');
      colors[name] = onColor(scales[/** @type {ScaleName} */ (sc)][Number(st) - 1]);
    } else if (src.includes('.')) {
      const [sc, st] = src.split('.');
      colors[name] = A(scales[/** @type {ScaleName} */ (sc)][Number(st) - 1]);
    } else colors[name] = derived[src];
  }
  for (const [name, value] of Object.entries(doc.color.overrides ?? {})) {
    const c = /** @type {OklchA} */ (parseColor(value));
    colors[name] = { ...canon(c), alpha: c.alpha };
    notes.push(`override: ${name} = ${value}`);
  }
  if (doc.color.overrides?.text) colors['text-inverse'] = colors.bg;

  // ── tokens
  /** @type {Record<string, string>} */
  const tokens = {};
  /** @type {Record<string, string>} */
  const hex = {};
  for (const [s, arr] of Object.entries(scales)) arr.forEach((c, i) => { tokens[`--${s}-${i + 1}`] = formatOklch(c); hex[`--${s}-${i + 1}`] = toHex(c); });

/* Unraid in every size: the "re-lay out, never scale" demo */
function unraidBody(w, size, D, head) {
  const { disks, sv } = D;
  const arr = meter(71, { warn: 85, crit: 95, tick: 85, label: 'Array used' });
  const diskList = (rows) => `<div class="disks">${disks.slice(0, rows).map((d) => `<div class="disk"><span class="n" style="text-align:left">${d.d}</span>${d.use == null ? '<span class="sub">valid</span>' : meter(d.use, { warn: 90, crit: 97, thin: true, label: d.d })}<span class="n">${d.use == null ? '' : d.use + '%'}</span><span class="n">${d.t}°</span></div>`).join('')}</div>`;
  switch (size) {
    case 'glyph': return `<div class="th"><span class="mono">${w.mono}</span><span class="tn">jupiter</span></div><div class="gv">71%</div><div class="gl">array</div>`;
    case 'strip': return `<div class="row" style="align-items:center;height:100%"><div class="th" style="flex:none"><span class="mono">${w.mono}</span><span class="tn">jupiter</span></div><div style="flex:1">${arr}</div><span class="n" style="color:var(--text-2)">71%</span><span class="sub nb">parity ✓ · 41°</span></div>`;
    case 'small': return `${head(w)}<div class="v">71<span class="u">%</span></div>${arr}<div class="tf"><span>parity valid</span></div>`;
    case 'wide': return `${head(w, tag('ok', 'parity valid'))}<div class="split"><div class="col"><div class="v">71<span class="u">% of 62 TB</span></div>${arr}</div>
      <dl class="kv"><dt>Parity</dt><dd>6d ago</dd><dt>Hottest</dt><dd>disk1 41°</dd><dt>Containers</dt><dd>24</dd></dl></div>`;
    case 'tall': return `${head(w)}<div class="v">71<span class="u">%</span></div>${arr}<div class="sub">parity valid · checked 6d ago</div>${diskList(7)}<div class="tf"><span><span class="n">24</span> containers</span></div>`;
    case 'large': return `${head(w, tag('ok', 'parity valid'))}<div class="row"><div class="v lg">71<span class="u">% of 62 TB</span></div><span class="lab">parity 6d ago</span></div>${arr}
      <div style="margin-top:6px">${diskList(7)}</div><div class="tf"><span><span class="n">24</span> containers · <span class="n">2</span> VMs off</span><span>cache <span class="n">44%</span></span></div>`;
    case 'hero': return `${head(w, tag('ok', 'parity valid · 6d ago'))}<div style="display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:22px;flex:1;min-height:0">
      <div class="diskmap">${disks.map((d) => `<div class="dm"><div class="bar${d.use == null ? " par" : d.use >= 90 ? " attn" : ""}" data-tip="${d.d}|${d.use == null ? "parity · valid" : d.use + "% used"} · ${d.t}°"><i style="height:${d.use == null ? 100 : d.use}%"></i></div><small>${d.d}</small><small>${d.t}°</small></div>`).join('')}</div>
      <div class="col" style="justify-content:space-between"><div><div class="v lg">71<span class="u">% of 62 TB</span></div>${arr}</div>
        <div><div class="lab" style="margin-bottom:6px">Hottest disk · 24h</div>${spark('temp-' + uid(), sv.temp, { band: [33, 42], fmt: (v) => v.toFixed(1) + '°', h: 62, label: 'Hottest disk temperature' })}</div>
        <dl class="kv"><dt>Containers</dt><dd>24 running</dd><dt>VMs</dt><dd>2 stopped</dd><dt>Flash backup</dt><dd>today 03:00</dd></dl></div></div>`;
  }
  return '';
}

/* ═════════════════ Render: motion study ═════════════════ */
function curveSVG(name) {
  const W = 100, Hh = 56, pad = 4;
  let pts = [], settle = 0.15, perceptual = null, label = '';
  if (ChaTokens.MOTION[name]) {
    const m = ChaTokens.MOTION[name], s = ChaTokens.spring(m.duration, m.bounce);
    settle = s.settle; perceptual = m.duration;
    for (let i = 0; i <= 80; i++) { const t = (settle * i) / 80; pts.push([t / settle, 1 - s.state(t).x]); }
    label = `settles ${Math.round(settle * 1000)} ms`;
  } else if (name === 'value') {
    const bez = (t) => { const c = [0.22, 1, 0.36, 1]; let lo = 0, hi = 1; for (let k = 0; k < 30; k++) { const m = (lo + hi) / 2; const x = 3 * (1 - m) ** 2 * m * c[0] + 3 * (1 - m) * m * m * c[2] + m ** 3; if (x < t) lo = m; else hi = m; } const m = (lo + hi) / 2; return 3 * (1 - m) ** 2 * m * c[1] + 3 * (1 - m) * m * m * c[3] + m ** 3; };
    for (let i = 0; i <= 80; i++) pts.push([i / 80, bez(i / 80)]);
    settle = 0.6; label = '600 ms tween';
  } else { for (let i = 0; i <= 80; i++) { const t = i / 80; pts.push([t, t * t * (3 - 2 * t)]); } label = '150 ms crossfade'; }
  const X = (x) => pad + x * (W - pad * 2), Y = (y) => Hh - pad - y * (Hh - pad * 2) * 0.86;
  const d = pts.map((p, i) => (i ? 'L' : 'M') + X(p[0]).toFixed(2) + ' ' + Y(p[1]).toFixed(2)).join(' ');
  // the plot stretches to the card; labels are HTML so they never distort
  const px = perceptual ? X(perceptual / settle) : 0;
  const pd = perceptual ? `<line class="pd" x1="${px}" x2="${px}" y1="${pad}" y2="${Hh - pad}"/>` : '';
  return `<div class="curvebox" role="img" aria-label="${name} easing curve, ${label}"><svg class="curve" viewBox="0 0 ${W} ${Hh}" preserveAspectRatio="none" aria-hidden="true"><line class="ax" x1="${pad}" x2="${W - pad}" y1="${Y(1)}" y2="${Y(1)}" vector-effect="non-scaling-stroke"/><line class="ax" x1="${pad}" x2="${W - pad}" y1="${Y(0)}" y2="${Y(0)}" vector-effect="non-scaling-stroke"/>${pd}<path class="ln" d="${d}"/></svg>
    ${perceptual ? `<span class="cl" style="left:calc(${px}% + 5px);top:2px">${Math.round(perceptual * 1000)} ms</span>` : ''}<span class="cl" style="right:4%;bottom:0">${label}</span></div>`;
}
function renderMotion() {
  CURRENT = widgets(data());

  const card = (name, title, sub, desc, demo) => `<article class="mcard" data-mcard="${name}"><h3>${title} <small>${sub}</small></h3>${curveSVG(name)}<p>${desc}</p>${demo}</article>`;
  board.innerHTML = `<section class="view-head"><div class="eyebrow"><span>Motion study</span><span>springs from the tokens</span></div>
      <h1 class="sentence">Motion explains change. It never decorates.</h1>
      <p class="sentence-2">Every spring is defined by duration and bounce, sampled from the physics into a CSS <span class="n">linear()</span> easing, and interruptible in script. Under reduced motion everything crossfades. No infinite loops anywhere.</p></section>
    <div class="grid"><section class="sec" style="--span:12">
      <header class="sh"><span>On the front page</span><span class="sh-rule"></span><span class="sh-m">the four moments from the brief</span></header>
      <div class="try" style="margin-bottom:var(--space-6)">
        <button class="btn" data-try="expand">Expand in place · Fleet</button>
        <button class="btn" data-try="reflow">Reflow springs · today ↔ quiet</button>
        <button class="btn" data-try="hold">Hold ring · reboot pluto</button>
        <button class="btn" data-try="lens">Lens fade · backups</button>
        <span style="flex:1"></span>
        <div class="seg" role="group" aria-label="Speed"><button data-set="slow:1" aria-pressed="${S.slow === 1}">1×</button><button data-set="slow:5" aria-pressed="${S.slow === 5}">Slow 5×</button></div>
        <div class="seg" role="group" aria-label="Motion"><button data-set="motion:system" aria-pressed="${S.motion === 'system'}">System</button><button data-set="motion:full" aria-pressed="${S.motion === 'full'}">Full</button><button data-set="motion:reduced" aria-pressed="${S.motion === 'reduced'}">Reduced</button></div>

      if (v === undefined) continue;
      if (typeof v === 'object' && v !== null) {
        if (flat(v) && Object.keys(v).length <= 4) lines.push(`${ind}${k}: { ${Object.entries(v).map(([a, b]) => `${a}: ${scalar(b)}`).join(', ')} }`);
        else { lines.push(`${ind}${k}:`); walk(v, ind + '  '); }
      } else lines.push(`${ind}${k}: ${scalar(v)}`);
    }
  };
  walk(doc, '');
  return lines.join('\n') + '\n';
}

/* ═════════════════ Prototype chrome: controls bar and thumb bar ═════════════════ */
function buildProto() {
  const seg = (k, label, opts) => `<span class="lab">${label}</span><div class="seg" role="group" aria-label="${label}">${opts.map(([v, l]) => `<button data-set="${k}:${v}" aria-pressed="false">${l}</button>`).join('')}</div>`;
  const dots = THEME_DOCS.map((d) => { const h = RESOLVED[d.id].hex; return `<button class="dot" data-set="theme:${d.id}" aria-pressed="false" title="${esc(d.name)}" aria-label="Theme: ${esc(d.name)}" style="--d-bg:${h['--bg']};--d-surface:${h['--surface']};--d-text:${h['--text']};--d-att:${h['--attention']}"></button>`; }).join('');
  $('#proto').innerHTML = seg('moment', 'Moment', [['incident', 'Today'], ['quiet', 'All quiet'], ['first', 'First run'], ['offline', 'Offline']])
    + seg('view', 'View', [['board', 'Front page'], ['wall', 'Wall'], ['workbench', 'Workbench'], ['motion', 'Motion']])
    + `<span class="lab">Theme</span><div class="dots" role="group" aria-label="Theme">${dots}</div>`
    + `<div class="seg" role="group" aria-label="Frame"><button data-set="frame:desktop" aria-pressed="false">Desktop</button><button data-set="frame:phone" aria-pressed="false">Phone</button></div>`
    + `<button class="studio-btn" data-act="studio" aria-label="Appearance">${ICON.paint}<span>Appearance</span></button><button class="kb" data-act="help" title="Keyboard shortcuts">⌘K · ?</button><button class="collapse" data-act="proto-min" aria-label="Collapse prototype controls">${GLYPH.cross}</button>`;
}
function renderThumbbar() {
  const n = pendingRepairs();
  $('#thumbbar').innerHTML = `<button data-act="search" aria-label="Search">${ICON.search}<span>Search</span></button><button data-act="inbox" aria-label="Inbox, ${n} repairs">${ICON.inbox}<span>Inbox</span>${n ? `<span class="badge">${n}</span>` : ''}</button>`
    + (S.recent ? `<button data-act="recent" aria-label="Most recent action: ${esc(S.recent)}">${ICON.undo}<span class="recent">${esc(S.recent)}</span></button>` : '');
}
function syncChrome() {
  const cur = { theme: S.custom ? 'custom' : S.theme };
  $$('[data-set]').forEach((b) => { const [k, v] = b.dataset.set.split(':'); b.setAttribute('aria-pressed', String(String(k in cur ? cur[k] : S[k]) === v)); });
  const collapse = $('#proto .collapse'); if (collapse) collapse.innerHTML = S.proto === 'min' ? '▴' : GLYPH.cross;
  renderThumbbar();
}

/* ═════════════════ Motion study demos ═════════════════ */
const DEMO = {};
function demoClick(box) {
  const kind = box.dataset.demo;
  if (kind === 'move') {
    const a = $('[data-b=a]', box), b = $('[data-b=b]', box), W = box.clientWidth - 96 - 24;
    const st = DEMO.move || (DEMO.move = { p: 0, target: 0, anim: null });
    st.target = st.target ? 0 : 1;
    const v = st.anim ? st.anim.velocity : 0; if (st.anim) st.anim.stop();
    if (reduced()) { st.p = st.target; a.style.transform = `translateX(${st.p * W}px)`; b.style.transform = `translateX(${-st.p * W}px)`; box.animate([{ opacity: 0.4 }, { opacity: 1 }], timing('fade')); return; }
    st.anim = animateSpring('move', st.p, st.target, (p) => { st.p = p; a.style.transform = `translateX(${p * W}px)`; b.style.transform = `translateX(${-p * W}px)`; }, { velocity: v });
  } else if (kind === 'sheet') {
    const blk = $('.mblock', box), W = box.clientWidth, Hh = box.clientHeight;
    const st = DEMO.sheet || (DEMO.sheet = { p: 0, target: 0, anim: null });
    st.target = st.target ? 0 : 1;
    const setP = (p) => { st.p = p; Object.assign(blk.style, { left: 12 * (1 - p) + 'px', bottom: 12 * (1 - p) + 'px', width: 84 + (W - 84) * p + 'px', height: 44 + (Hh - 44) * p + 'px', borderRadius: 6 + 4 * p + 'px' }); blk.textContent = p > 0.5 ? 'sheet · click to close' : 'tile'; };
    const v = st.anim ? st.anim.velocity : 0; if (st.anim) st.anim.stop();
    if (reduced()) { setP(st.target); blk.animate([{ opacity: 0 }, { opacity: 1 }], timing('fade')); return; }
    st.anim = animateSpring('sheet', st.p, st.target, setP, { velocity: v });
  } else if (kind === 'value') {
    const el = $('[data-roll="demo-v"]', box), cur = el.getAttribute('aria-label') || el.textContent.trim();
    roll(el, cur, cur === '64' ? '92' : '64');
  } else if (kind === 'fade') {
    const blk = $('.mblock', box), quiet = !blk.dataset.alt;
    const swap = () => { blk.dataset.alt = quiet ? '1' : ''; blk.innerHTML = quiet ? `${g('attn')}&nbsp;2 things need you` : `${g('ok')}&nbsp;All quiet`; };
    blk.animate([{ opacity: 1 }, { opacity: 0 }], { duration: timing('fade').duration, fill: 'forwards' }).onfinish = () => { swap(); blk.animate([{ opacity: 0 }, { opacity: 1 }], { duration: timing('fade').duration, fill: 'forwards' }); };
  }
}
document.addEventListener('pointerdown', (e) => {
  const blk = e.target.closest && e.target.closest('[data-demo="lift"] .mblock'); if (!blk) return;
  const st = DEMO.lift || (DEMO.lift = { s: 0, anim: null });
  const setS = (s) => { st.s = s; blk.style.transform = `scale(${1 + 0.05 * s})`; blk.style.boxShadow = s > 0.02 ? `0 ${14 * s}px ${34 * s}px -12px oklch(0 0 0 / ${0.55 * Math.min(1, s)})` : 'none'; };
  const go = (to) => { const v = st.anim ? st.anim.velocity : 0; if (st.anim) st.anim.stop(); if (reduced()) { setS(to); return; } st.anim = animateSpring('lift', st.s, to, setS, { velocity: v }); };
  go(1); blk.textContent = 'lifted';
  const up = () => { go(0); blk.textContent = 'hold to lift'; removeEventListener('pointerup', up); removeEventListener('pointercancel', up); };
  addEventListener('pointerup', up); addEventListener('pointercancel', up);
});
function tryMotion(kind) {
  const toBoard = () => { if (S.view !== 'board') { S.view = 'board'; applyAttrs(); render(); scrollTo(0, 0); screenEl.scrollTop = 0; } };
  if (kind === 'hold') return openConfirm('pluto');
  toBoard();
  if (kind === 'expand') { if (S.moment === 'first') set('moment', 'incident'); setTimeout(() => { const t = board.querySelector('.tile[data-id="fleet"]'); if (t) { t.scrollIntoView({ block: 'center', behavior: reduced() ? 'auto' : 'smooth' }); setTimeout(() => openSheet('fleet', t), 420); } }, 60); }
  if (kind === 'reflow') setTimeout(() => set('moment', S.moment === 'incident' ? 'quiet' : 'incident'), 60);
  if (kind === 'lens') { if (S.moment !== 'incident') set('moment', 'incident'); setTimeout(() => setLens(S.lens === 'backups' ? null : 'backups'), 120); }
}

/* ═════════════════ Events ═════════════════ */
function handleAct(a, el) {
  switch (a) {
    case 'inbox': return openInbox();
    case 'inbox-repair': { const k = el.dataset.repair; dismissSheet(); setTimeout(() => openInbox(k), 120); return; }
    case 'close': return dismissSheet();
    case 'close-inbox': return closeInbox();
    case 'close-confirm': return closeConfirm();
    case 'close-palette': return closePalette();
    case 'unlens': return setLens(null);
    case 'undo': toastEl.classList.remove('on'); S.recent = null; renderThumbbar(); return toast('Undone');
    case 'import': if (INBOX) closeInbox(); return openImport(el.closest('.setup-card') || el);
    case 'do-import': return doImport();
    case 'reconnect': set('moment', 'incident'); return toast('Reconnected to the hub. Everything is live again.');
    case 'studio': return toggleStudio();
    case 'help': return toast('1–4 views · T theme · M moment · P phone · A appearance · I inbox · E edit · ⌘K command · Esc close');
    case 'proto-min': S.proto = S.proto === 'min' ? 'full' : 'min'; applyAttrs(); return syncChrome();
    case 'reset-theme': return pickTheme(S.customFrom || S.theme);
    case 'try-orange': editDoc((d) => { d.color.status.attention = { hue: 45, chroma: 0.17 }; }); return;
    case 'try-amber-accent': editDoc((d) => { d.color.accent = 'oklch(0.76 0.14 78)'; }); return;
    case 'export': { const ta = $('#studio .export'); ta.classList.toggle('on'); ta.value = toYAML(activeDoc()); return; }
    case 'copy-theme': { const text = toYAML(activeDoc()); const ta = $('#studio .export'); ta.classList.add('on'); ta.value = text;
      (navigator.clipboard ? navigator.clipboard.writeText(text) : Promise.reject()).then(() => toast('Theme document copied')).catch(() => { ta.select(); toast('Selected; press ⌘C to copy'); }); return; }
    case 'search': return openPalette();
    case 'recent': return S.recent && toast(S.recent, { undo: true });
    case 'keep': S.kept = true; rerenderInbox(); render(); return toast('Kept 3 discovered services');
    case 'paperless-add': S.paperless = 'added'; rerenderInbox(); render(); return toast('Prototype: Paperless lands in Apps, in the nearest gap', { undo: true });
    case 'paperless-ignore': S.paperless = 'ignored'; rerenderInbox(); render(); return toast('Ignored paperless-ngx. Labels can bring it back.');
  }
}
document.addEventListener('click', (e) => {
  const t = e.target;
  if (!(t instanceof Element)) return;
  const st = t.closest('[data-set]'); if (st) { const [k, v] = st.dataset.set.split(':'); return set(k, v); }
  const act = t.closest('[data-act]'); if (act && !act.disabled) return handleAct(act.dataset.act, act);
  const fl = t.closest('[data-flow]'); if (fl && !fl.disabled) { const [k, s] = fl.dataset.flow.split(':'); return flow(k, s); }
  const cf = t.closest('[data-confirm]'); if (cf) { lastFocus = cf; return openConfirm(cf.dataset.confirm, cf.dataset.label); }
  const ty = t.closest('[data-typed]'); if (ty) { lastFocus = ty; return openTyped(ty.dataset.typed); }
  const un = t.closest('[data-undo]'); if (un) return toast(un.dataset.undo, { undo: true });
  const to = t.closest('[data-toast]'); if (to) return toast(to.dataset.toast);
  const tr = t.closest('[data-try]'); if (tr) return tryMotion(tr.dataset.try);
  const tab = t.closest('[data-tab]'); if (tab) return switchTab(tab);
  const dm = t.closest('[data-demo]'); if (dm && dm.dataset.demo !== 'lift' && dm.dataset.demo !== 'press') return demoClick(dm);
  const ph = t.closest('.phrase'); if (ph) return setLens(S.lens === ph.dataset.lens ? null : ph.dataset.lens);
  if (S.view !== 'board' || !board.contains(t)) return;
  const op = t.closest('[data-open]'); if (op) return openSheet(op.dataset.open, op.closest('.strip, .tile') || op);
  const tile = t.closest('.tile[data-id]');
  if (tile && !S.edit) {
    if (t.closest('.note') && (tile.dataset.id === 'plex' || tile.dataset.id === 'karakeep') && pendingRepairs()) return openInbox(tile.dataset.id);
    openSheet(tile.dataset.id, tile);
  }
});
document.addEventListener('keydown', (e) => {
  const typing = e.target.matches && e.target.matches('input, textarea, select');
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); return openPalette(); }
  if (e.key === 'Escape') { e.preventDefault(); return closeTop(); }
  if (e.key === 'Tab') {
    const top = topDialog(); if (!top) return;
    const f = $$('button:not([disabled]), [href], input, textarea, summary, [tabindex]:not([tabindex="-1"])', top).filter((x) => x.offsetParent !== null);
    if (!f.length) return;
    const first = f[0], last = f[f.length - 1];
    if (!top.contains(document.activeElement)) { e.preventDefault(); first.focus(); }
    else if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    return;
  }
  if (typing || e.metaKey || e.ctrlKey || e.altKey) return;
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('.phrase, .tile[data-id], .strip[data-open]')) { e.preventDefault(); return e.target.click(); }
  if (topDialog()) return;
  const k = e.key.toLowerCase();
  const ids = THEME_DOCS.map((d) => d.id), moments = ['incident', 'quiet', 'first', 'offline'];
  if (k >= '1' && k <= '4') set('view', ['board', 'wall', 'workbench', 'motion'][+k - 1]);
  else if (k === 't') pickTheme(ids[(ids.indexOf(S.theme) + (e.shiftKey ? ids.length - 1 : 1)) % ids.length]);
  else if (k === 'm') set('moment', moments[(moments.indexOf(S.moment) + 1) % moments.length]);
  else if (k === 'p') set('frame', S.frame === 'phone' ? 'desktop' : 'phone');
  else if (k === 'a') toggleStudio();
  else if (k === 'i') openInbox();
  else if (k === 'e' && S.view === 'board') toggleEdit();
  else if (k === '?') handleAct('help');
});
addEventListener('resize', () => { const was = isCompact(); applyAttrs(); if (was !== isCompact() && S.view === 'board') render(); });
mqReduce.addEventListener('change', () => syncChrome());

/* clock, phone status bar, burn-in care on the wall (1 px shift every 2 minutes, no animation) */
function tickClock() { const t = hhmm(new Date()); $$('[data-clock]').forEach((c) => { c.textContent = t; }); $('#sbtime').textContent = t; }
setInterval(tickClock, 10000);
setInterval(() => {
  const w = $('#wall'); if (!w) return;
  const x = Math.round(Math.random() * 2) - 1, y = Math.round(Math.random() * 2) - 1;
  w.style.setProperty('--shift-x', x + 'px'); w.style.setProperty('--shift-y', y + 'px');
  const s = $('[data-shift]'); if (s) s.textContent = `${x}, ${y}`;
}, 120000);

/* ═════════════════ Boot (state can be deep-linked: #theme=paper&view=wall&moment=quiet&frame=phone&studio=1) ═════════════════ */
(function boot() {
  const q = new URLSearchParams(location.hash.slice(1));
  const theme = q.get('theme');
  if (theme && docFor(theme)) { const d = docFor(theme); S.theme = theme; S.surface = d.surface; S.briefing = d.briefing; S.density = d.density; }
  for (const k of ['moment', 'view', 'frame', 'surface', 'density', 'briefing', 'motion', 'material']) if (q.get(k)) S[k] = q.get(k);
  if (q.get('studio') === '1') S.studio = true;
  if (innerWidth < 640) S.proto = 'min'; // prototype chrome stays out of the way on a real phone
  buildProto(); buildStudio();
  applyAttrs(); render(); tickClock();
  $('#studio').setAttribute('aria-hidden', String(!S.studio));
  syncStudio(true);
})();
</script>
