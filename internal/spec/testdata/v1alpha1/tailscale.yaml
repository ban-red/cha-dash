# Tailscale: the tailnet's devices, whether they're connected, when they
# were last seen and when their keys expire.
#
# Format: chadash/v1alpha1; see internal/README.md, "Tier 1 specs". Fixture
# test: tailscale_test.go, against testdata/tailscale/ (synthetic). Notes in
# recipes/tailscale.md.
#
# The instance URL is Tailscale's API, https://api.tailscale.com. The tailnet
# is "-", the API key's own tailnet.
apiVersion: chadash/v1alpha1
kind: Integration
meta:
  id: tailscale
  name: Tailscale
  icon: tailscale
  version: 0.1.0
  tier: bronze
  category: network
  capabilities: [net.vpn]

config:
  api_key: { type: secret, title: API key, required: true, description: "Settings → Keys → Generate API key in Tailscale's admin console (it starts tskey-api-)" }
  expiry_warn_days: { type: integer, title: Days before a key expires to warn, default: 14, min: 1, max: 90 }
  stale_days: { type: integer, title: Days offline before attention, default: 7, min: 1, max: 365 }

source:
  headers:
    Authorization: "Bearer {{ secret.api_key }}"
  timeout: 15s

every: 300s

requests:
  # The default field set has everything read here: connectedToControl,
  # lastSeen (left out while connected), keyExpiryDisabled, expires.
  devices:
    path: /api/v2/tailnet/-/devices
    extract:
      list: devices

resources:
  - id: app
    kind: app
    name: instance.name
    state: '"running"'
    health: |
      let warn = now() + duration(string((config.expiry_warn_days ?? 14) * 24) + "h");
      len(filter(devices.list ?? [], {!(.isExternal ?? false) && !(.keyExpiryDisabled ?? false) && (.expires ?? "0001") > "0002" && date(.expires) <= warn})) > 0 ? "attention" : "ok"
    reason: |
      let warn = now() + duration(string((config.expiry_warn_days ?? 14) * 24) + "h");
      let mine = filter(devices.list ?? [], {!(.isExternal ?? false) && !(.keyExpiryDisabled ?? false) && (.expires ?? "0001") > "0002"});
      let expired = len(filter(mine, {date(.expires) <= now()}));
      let soon = len(filter(mine, {date(.expires) > now() && date(.expires) <= warn}));
      join(filter([
        expired == 0 ? "" : (expired == 1 ? "1 key has expired" : string(expired) + " keys have expired"),
        soon == 0 ? "" : (soon == 1 ? "1 key expires" : string(soon) + " keys expire") + " within " + string(config.expiry_warn_days ?? 14) + " days"
      ], {# != ""}), "; ")
    attrs:
      type: '"tailscale"'
      devices: 'devices.list == nil ? nil : len(filter(devices.list, {!(.isExternal ?? false)}))'
      shared_in: 'devices.list == nil ? nil : len(filter(devices.list, {.isExternal ?? false}))'
    caps: [net.vpn]
    links:
      - { title: Tailscale, url: config.url }

  # One host per device of the tailnet (devices shared in from another
  # tailnet are left out: their keys aren't this tailnet's), by name.
  - id: device
    each: 'sortBy(filter(devices.list ?? [], {!(.isExternal ?? false)}), .hostname ?? "")'
    key: item.nodeId ?? item.id
    part_of: app
    kind: host
    name: item.hostname ?? item.name
    state: '(item.connectedToControl ?? false) ? "online" : "offline"'
    health: |
      let exp = !(item.keyExpiryDisabled ?? false) && (item.expires ?? "0001") > "0002" ? date(item.expires) : nil;
      exp != nil && exp <= now() ? "down" :
        (exp != nil && exp <= now() + duration(string((config.expiry_warn_days ?? 14) * 24) + "h") ? "attention" :
          (item.authorized == false ? "attention" :
            (!(item.connectedToControl ?? false) && (item.lastSeen ?? "") != "" && date(item.lastSeen) < now() - duration(string((config.stale_days ?? 7) * 24) + "h") ? "attention" : "ok")))
    reason: |
      let exp = !(item.keyExpiryDisabled ?? false) && (item.expires ?? "0001") > "0002" ? date(item.expires) : nil;
      let days = exp == nil ? 0 : int((exp - now()).Hours() / 24);
      let gone = (item.lastSeen ?? "") == "" ? 0 : int((now() - date(item.lastSeen)).Hours() / 24);
      exp != nil && exp <= now() ? "Its key expired on " + exp.Format("2006-01-02") + ", so it's off the tailnet until it signs in again" :
        (exp != nil && exp <= now() + duration(string((config.expiry_warn_days ?? 14) * 24) + "h") ? (days < 1 ? "Its key expires within a day" : "Its key expires in " + string(days) + (days == 1 ? " day" : " days")) :
          (item.authorized == false ? "It's waiting for approval in the admin console" :
            (!(item.connectedToControl ?? false) && gone >= (config.stale_days ?? 7) ? "Not seen for " + string(gone) + " days" : "")))
    attrs:
      type: '"tailscale.device"'
      hostname: '(item.name ?? "") != "" ? item.name : nil'
      tailscale_ip: 'len(filter(item.addresses ?? [], {!(# contains ":")})) > 0 ? filter(item.addresses, {!(# contains ":")})[0] : nil'
      os: '(item.os ?? "") != "" ? item.os : nil'
      client_version: '(item.clientVersion ?? "") != "" ? item.clientVersion : nil'
      update_available: item.updateAvailable ?? nil
      tags: 'len(item.tags ?? []) > 0 ? item.tags : nil'
      last_seen: '(item.lastSeen ?? "") != "" ? item.lastSeen : nil'
      key_expiry_disabled: item.keyExpiryDisabled ?? nil
      key_expires: '!(item.keyExpiryDisabled ?? false) && (item.expires ?? "0001") > "0002" ? item.expires : nil'
      authorized: item.authorized ?? nil
    caps: [net.vpn]

metrics:
  - { resource: app, key: devices, value: 'devices.list == nil ? nil : float(len(filter(devices.list, {!(.isExternal ?? false)})))', unit: count, max: 1000, band: [0, 1000] }
  - { resource: app, key: devices.online, value: 'devices.list == nil ? nil : float(len(filter(devices.list, {!(.isExternal ?? false) && (.connectedToControl ?? false)})))', unit: count, max: 1000, band: [0, 1000] }
  - resource: app
    key: keys.expiring
    value: |
      devices.list == nil ? nil : float(len(filter(devices.list, {!(.isExternal ?? false) && !(.keyExpiryDisabled ?? false) && (.expires ?? "0001") > "0002" &&
        date(.expires) <= now() + duration(string((config.expiry_warn_days ?? 14) * 24) + "h")})))
    unit: count
    max: 100
    band: [0, 0]
    warn: 1
    crit: 1
