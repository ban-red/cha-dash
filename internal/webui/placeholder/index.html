<h1>Cha Dash</h1>
<p>The hub is running, but the web app isn't embedded in this build.</p>
<p>To build it in, run these at the repository root:</p>
<pre>bun install
bun run build
go build -tags webui ./cmd/chadash</pre>
<p>The API and the realtime socket work without it.</p>
<p>First run? The web app creates the owner account.</p>
